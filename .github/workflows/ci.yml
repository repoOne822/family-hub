name: CI
# Every push and pull request: static checks + headless smoke test of the hub and every learning app.
# Deploy to GitHub Pages only after the tests pass — enable by setting the repo variable PAGES_VIA_ACTIONS=true
# and switching Settings → Pages → Source to "GitHub Actions" (see RUNBOOK.md).
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks (syntax, inline scripts, secrets)
        run: node tests/check.mjs
      - name: Smoke test every page
        run: node tests/smoke.mjs
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf tests .github package.json node_modules supabase
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow"><script>if(window.top===window){location.replace("../#brain");}</script>
<title>Jonah's Brain Park</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;font-family:"Baloo 2",system-ui,sans-serif;color:#2b2d42;background:linear-gradient(180deg,#e9f5ff 0%,#f6efff 100%);touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top h1{font-size:28px;margin:0;flex:1}
.coins{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 14px 4px 8px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #0001}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc300 50%,#c98a00);display:inline-block;box-shadow:inset 0 0 0 2px #a86f00}
.btn{border:none;border-radius:16px;font-family:inherit;font-weight:800;font-size:20px;padding:10px 18px;cursor:pointer;background:#fff;color:#2b2d42;box-shadow:0 4px 0 #0002}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0002}
.btn.go{background:linear-gradient(#80ed99,#38b000);color:#fff}
.btn.round{width:52px;height:52px;padding:0;border-radius:50%;font-size:24px}
.sec{margin:14px 0 6px;font-size:20px;font-weight:800;color:#5a4fcf}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:none;border-radius:22px;padding:14px 8px;background:#fff;cursor:pointer;font-family:inherit;text-align:center;box-shadow:0 5px 0 #0001;color:#2b2d42}
.tile .ic{font-size:46px;display:block}
.tile b{display:block;font-size:18px}
.tile small{font-size:14px;color:#6c757d}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border-radius:24px;padding:16px;box-shadow:0 6px 18px #0001}
.instr{font-size:20px;text-align:center;margin:4px 0 10px;min-height:28px}
.area{position:relative;min-height:380px}
.lvl{font-size:16px;color:#6c757d}
/* match */
.mgrid{display:grid;gap:10px;margin:0 auto;max-width:560px}
.mc{aspect-ratio:1;perspective:600px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:min(10vw,52px)}
.mc .fa{background:linear-gradient(135deg,#a0c4ff,#bdb2ff)}.mc .fa::after{content:"?";color:#fff;font-weight:800;font-size:.8em}
.mc .ba{background:#fff;border:3px solid #bdb2ff;transform:rotateY(180deg)}
.mc.done .ba{border-color:#80ed99;background:#e3f9e8}
/* simon */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:380px;margin:0 auto}
.pad{aspect-ratio:1;border-radius:28px;border:none;cursor:pointer;opacity:.45;transition:opacity .12s,transform .12s;font-size:44px}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 30px currentColor}
/* odd / pattern / switch */
.ogrid{display:grid;gap:8px;max-width:560px;margin:0 auto}
.oc{border:none;background:#fff;border-radius:14px;aspect-ratio:1;font-size:min(8vw,40px);cursor:pointer;box-shadow:0 3px 0 #0001}
.oc.bad{background:#ffe3e8}.oc.good{background:#d8f7e7}
.train{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px}
.car{width:64px;height:64px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 4px 0 #0001;border:3px solid #bdb2ff}
.car.q{border-style:dashed;color:#bdb2ff;font-weight:800}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ch{width:84px;height:84px;border-radius:18px;border:none;background:#fff;font-size:44px;cursor:pointer;box-shadow:0 5px 0 #0002}
.ch.bad{background:#ffe3e8;opacity:.5}.ch.good{background:#d8f7e7}
.bins{display:flex;gap:16px;justify-content:center;margin-top:16px}
.bin{flex:1;max-width:220px;border:4px dashed #bdb2ff;border-radius:22px;background:#fff;padding:12px;text-align:center;cursor:pointer;font-family:inherit}
.bin svg{width:80px;height:80px}
.rule{font-size:26px;font-weight:800;text-align:center;padding:6px 12px;border-radius:14px;display:inline-block}
.cardc{margin:10px auto;width:120px;height:120px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0002}
.cardc svg{width:90px;height:90px}
/* gonogo */
.gstage{height:300px;display:flex;align-items:center;justify-content:center}
.gbtn{width:220px;height:220px;border-radius:50%;border:none;font-size:90px;cursor:pointer;transition:transform .08s;background:#eef1f6;box-shadow:0 8px 0 #0002}
.gbtn.go{background:radial-gradient(circle at 35% 30%,#b9fbc0,#38b000)}
.gbtn.no{background:radial-gradient(circle at 35% 30%,#ffb3c1,#d00000)}
.gbtn:active{transform:scale(.96)}
/* shapes */
.board{position:relative;height:260px;background:#f8f9fa;border-radius:20px;border:3px dashed #ced4da}
.tray{position:relative;height:140px;margin-top:12px;background:#fff;border-radius:20px}
.piece,.slot{position:absolute;width:84px;height:84px}
.piece{cursor:grab;touch-action:none;transition:transform .15s;z-index:2}
.piece.drag{z-index:9;transition:none}
.slot svg path,.slot svg circle,.slot svg polygon,.slot svg rect,.slot svg ellipse{fill:#e9ecef;stroke:#adb5bd;stroke-width:3;stroke-dasharray:6 5}
/* robot */
.rgrid{display:grid;gap:4px;margin:0 auto;max-width:420px;background:#dfe7fd;padding:6px;border-radius:16px}
.rc{aspect-ratio:1;background:#f8f9ff;box-shadow:inset 0 0 0 2px #c7d2fe;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:min(7vw,34px);position:relative}
.prog{display:flex;gap:6px;flex-wrap:wrap;min-height:58px;background:#f1edff;border-radius:16px;padding:8px;margin:10px auto;max-width:520px;align-items:center}
.cmd{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 0 #0002}
.cmd.run{background:#ffd166}
.arrows{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.arrows .btn{font-size:28px;min-width:64px}
/* draw */
#pad{width:100%;height:420px;background:#fff;border-radius:20px;touch-action:none;display:block;box-shadow:inset 0 0 0 3px #e9ecef}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px #0003;cursor:pointer}
.sw.on{border-color:#2b2d42}
.tool{border:none;background:#fff;border-radius:12px;font-size:26px;width:48px;height:48px;cursor:pointer;box-shadow:0 2px 6px #0002}
.tool.on{background:#ffd166}
/* music */
.xylo{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:240px;margin:10px 0}
.bar{flex:1;max-width:80px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-weight:800;font-size:20px;color:#fff;transition:transform .08s,filter .1s;box-shadow:0 5px 0 #0002}
.bar.hl{outline:5px solid #2b2d42;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:translateY(-6px)}}
.bar.hit{filter:brightness(1.3);transform:translateY(4px)}
.drum{width:180px;height:180px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#ffe8a3,#e09f3e);font-size:80px;cursor:pointer;box-shadow:0 8px 0 #0002;display:block;margin:10px auto}
.drum.hit{transform:scale(.95)}
.beats{display:flex;gap:8px;justify-content:center;min-height:30px;font-size:24px}
/* modal */
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.mcard{background:#fff;border-radius:26px;padding:22px;max-width:420px;width:100%;text-align:center;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.stars{font-size:54px;letter-spacing:6px}.stars .off{filter:grayscale(1);opacity:.25}
.fb{text-align:center;font-size:22px;font-weight:800;min-height:32px;margin-top:8px}
.fb.good{color:#2d6a4f}.fb.bad{color:#c9184a}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:5px;border-bottom:1px solid #eee}
.note{font-size:14px;color:#6c757d}
.hidden{display:none}
#mWhy{z-index:30}#mWhy .mcard{max-width:460px}#wBody{font-size:21px;line-height:1.35;margin:6px 0}#wBody .wp{background:#ffe3e8;border-radius:12px;padding:6px 10px;margin:6px 0}#wBody .wa{background:#d8f7e7;border-radius:12px;padding:6px 10px;margin:6px 0}#wBody .big{font-size:40px;vertical-align:middle}
#wOk:disabled{opacity:.45;filter:grayscale(.6)}#wOk.ready{animation:wp 1s ease-in-out infinite}@keyframes wp{50%{transform:scale(1.06)}}
#wBar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin:10px auto 0;max-width:240px}#wBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#80ed99,#4cc9f0)}
.tag{display:inline-block;background:#f1edff;color:#5a4fcf;border-radius:10px;padding:2px 10px;font-size:16px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <!-- HOME -->
  <section class="screen on" id="home">
    <div class="top"><h1>🧠 Brain Park</h1><div class="coins"><span class="coin"></span><span class="cc">0</span></div></div>
    <div id="tiles"></div>
    <p style="text-align:center;margin-top:18px"><button class="btn" id="toParents" style="font-size:15px">Parents</button></p>
  </section>
  <!-- GAME -->
  <section class="screen" id="game">
    <div class="top"><button class="btn round" id="back">🏠</button><h1 id="gTitle" style="font-size:24px"></h1><span class="lvl" id="gLvl"></span><button class="btn round" id="gSay">🔊</button></div>
    <div class="card"><div class="instr" id="instr"></div><div class="area" id="area"></div><div class="fb" id="fb"></div></div>
  </section>
  <!-- PARENTS -->
  <section class="screen" id="parents">
    <div class="top"><button class="btn round" id="pBack">⬅️</button><h1 style="font-size:24px">Parent corner</h1></div>
    <div class="card">
      <p class="note">Each game adapts: 3 stars moves up a level, 1 star moves down. Brain measures below are trends for you, not test scores.</p>
      <table><thead><tr><th>Game</th><th>Level</th><th>Rounds</th><th>Avg stars</th><th>Brain measure</th></tr></thead><tbody id="pTable"></tbody></table>
      <p class="note" style="margin-top:10px">Read instructions aloud: <select id="sVoice"><option value="1">On</option><option value="0">Off</option></select></p>
      <button class="btn" id="pCopy" style="font-size:16px">Copy summary</button> <span class="note" id="pMsg"></span>
    </div>
  </section>
</div>
<div class="modal" id="mWhy"><div class="mcard"><div style="font-size:52px" id="wEmoji">🧠</div><h2 id="wTitle" style="margin:0">Let's learn from this</h2><div id="wBody"></div><div id="wBar"><i></i></div><div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn" id="wAgain">🔊 Hear again</button><button class="btn go" id="wOk" disabled>👂 Listen…</button></div></div></div>
<div class="modal" id="mDone"><div class="mcard"><div style="font-size:56px" id="mdE">🎉</div><h2 id="mdT" style="margin:4px 0">Great job!</h2><div class="stars" id="mdS"></div><div id="mdC" style="font-size:22px;font-weight:800"></div><div id="mdL" style="color:#5a4fcf;font-weight:800;margin-top:4px"></div><div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class="btn go" id="mdAgain">Play again</button><button class="btn" id="mdHome">🏠</button></div></div></div>

<script>
const QS=new URLSearchParams(location.search),KID=(QS.get("k")||"jonah").replace(/[^a-z0-9_-]/gi,"")||"jonah",IS_PARENT=QS.get("p")==="1"||window.top===window;
const NAME=KID.charAt(0).toUpperCase()+KID.slice(1),KEY=KID+"_brain_state";
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>new Date().toLocaleDateString("en-CA");
let S={v:1,coins:0,voice:1,lv:{},st:{},days:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const setCoins=()=>document.querySelectorAll(".cc").forEach(e=>e.textContent=S.coins);
let ac;function A(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(f,d,t=0,type="sine",v=.15){const a=A();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.02)}catch(e){}}
const sfx={good:()=>{tone(660,.12);tone(880,.18,.1)},bad:()=>tone(200,.22,0,"triangle"),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,i*.12,"triangle",.12)),tap:()=>tone(520,.06,0,"sine",.08)};
function speak(t){if(!+S.voice||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.88;u.pitch=1.1;u.lang="en-US";speechSynthesis.speak(u)}catch(e){}}
function estRead(t){return Math.max(2000,String(t).trim().split(/\s+/).length*300)}
function speakDone(t){return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};const est=estRead(t);
  if(!+S.voice||!window.speechSynthesis){setTimeout(fin,est);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.88;u.pitch=1.1;u.lang="en-US";u.onend=()=>setTimeout(fin,400);u.onerror=()=>setTimeout(fin,est);speechSynthesis.speak(u)}catch(e){setTimeout(fin,est)}
  setTimeout(fin,est*2.2+3000)})}
let gateTok=0;
/* After a mistake: explain why, read it aloud, and only unlock the button once it has been heard. */
function gate(o){return new Promise(res=>{const tok=++gateTok;$("wEmoji").textContent=o.emoji||"🧠";$("wTitle").textContent=o.title||"Let's learn from this";$("wBody").innerHTML=o.html;
  const b=$("wOk"),bar=$("wBar").firstElementChild;b.disabled=true;b.classList.remove("ready");b.textContent="👂 Listen…";$("mWhy").classList.add("on");
  const run=()=>{const ms=estRead(o.say);bar.style.transition="none";bar.style.width="0";void bar.offsetWidth;bar.style.transition=`width ${ms/1000}s linear`;bar.style.width="100%";return Promise.all([speakDone(o.say),delay(Math.min(ms,4000))])};
  run().then(()=>{if(gateTok!==tok)return;b.disabled=false;b.textContent=o.btn||"I got it 👍";b.classList.add("ready")});
  $("wAgain").onclick=()=>run();
  b.onclick=()=>{if(b.disabled||gateTok!==tok)return;gateTok++;$("mWhy").classList.remove("on");try{speechSynthesis.cancel()}catch(e){}res(true)}})}
function closeGate(){gateTok++;$("mWhy").classList.remove("on")}
const st=id=>S.st[id]||(S.st[id]={rounds:0,stars:0,m:[]});
const lv=id=>S.lv[id]||1;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
let token=0; // cancels running games
function fb(t,c){$("fb").textContent=t;$("fb").className="fb "+(c||"")}

/* ---------- registry ---------- */
const GAMES=[
 {sec:"🧩 Memory & focus",id:"match",ic:"🃏",n:"Pair Match",max:6,run:playMatch,say:"Flip two cards at a time. Find all the matching pairs!"},
 {sec:"🧩 Memory & focus",id:"simon",ic:"💡",n:"Copy the Lights",max:8,run:playSimon,say:"Watch the lights, then tap them in the same order."},
 {sec:"🧩 Memory & focus",id:"odd",ic:"🔍",n:"Odd One Out",max:6,run:playOdd,say:"Find the one that is different!"},
 {sec:"🧠 Brain builders",id:"gonogo",ic:"🚦",n:"Stop & Go",max:6,run:playGoNo,say:"Tap the green rocket as fast as you can. Do NOT tap the red stop sign!"},
 {sec:"🧠 Brain builders",id:"switch",ic:"🔀",n:"Rule Switch",max:5,run:playSwitch,say:"Sort each card. Listen to the rule: color or shape!"},
 {sec:"🧮 Puzzles & logic",id:"pattern",ic:"🚂",n:"Pattern Train",max:6,run:playPattern,say:"What comes next on the pattern train?"},
 {sec:"🧮 Puzzles & logic",id:"shapes",ic:"🔷",n:"Shape Puzzle",max:5,run:playShapes,say:"Drag each shape into the matching outline."},
 {sec:"🧮 Puzzles & logic",id:"robot",ic:"🤖",n:"Robot Coder",max:6,run:playRobot,say:"Tap the arrows to make a plan, then press Go to help the robot reach the star!"},
 {sec:"🎨 Create & music",id:"draw",ic:"🖍️",n:"Color Pad",max:1,run:playDraw,say:"Draw anything you like!"},
 {sec:"🎨 Create & music",id:"music",ic:"🎵",n:"Music Maker",max:4,run:playMusic,say:"Play the music bars, or copy the drum beat!"},
];
function renderHome(){setCoins();let html="",cur="";GAMES.forEach(g=>{if(g.sec!==cur){if(cur)html+="</div>";cur=g.sec;html+=`<div class="sec">${g.sec}</div><div class="tiles">`}
  const s=S.st[g.id];html+=`<button class="tile" data-g="${g.id}"><span class="ic">${g.ic}</span><b>${g.n}</b><small>${g.id==="draw"?"Free play":`Level ${lv(g.id)}`}${s&&s.rounds?` · ${"⭐".repeat(Math.round(s.stars/s.rounds))}`:""}</small></button>`});
  $("tiles").innerHTML=html+"</div>";document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{A();openGame(b.dataset.g)})}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
let curG=null;
function openGame(id){curG=GAMES.find(g=>g.id===id);token++;show("game");$("gTitle").textContent=curG.ic+" "+curG.n;$("gLvl").textContent=id==="draw"?"":"Level "+lv(id);$("instr").textContent=curG.say;fb("");$("area").innerHTML="";speak(curG.say);setTimeout(()=>curG.run(token),400)}
function finish(id,score,metric,extra){const g=GAMES.find(x=>x.id===id),s=st(id);const stars=score>=.9?3:score>=.6?2:1;s.rounds++;s.stars+=stars;s.m.push(metric);if(s.m.length>20)s.m.shift();
  const old=lv(id);let lvMsg="";if(stars===3&&old<g.max){S.lv[id]=old+1;lvMsg=`⬆️ Level ${old+1} next!`}else if(stars===1&&old>1){S.lv[id]=old-1;lvMsg="Let's practice an easier level."}
  const c=stars*5;S.coins+=c;const d=S.days[today()]||(S.days[today()]={rounds:0});d.rounds++;save();setCoins();
  try{if(window.parent!==window&&window.parent.fhAward)window.parent.fhAward("brain",`${id}:${Date.now()}`,stars,`Brain Park ${g.n} ${"⭐".repeat(stars)}`,`大脑乐园 ${g.n} ${"⭐".repeat(stars)}`)}catch(e){}
  $("mdE").textContent=stars===3?"🌟":stars===2?"🎉":"💪";$("mdT").textContent=stars===3?"Amazing!":stars===2?"Great job!":"Good try!";$("mdS").innerHTML=[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">⭐</span>`).join("");
  $("mdC").innerHTML=`<span class="coin" style="vertical-align:middle"></span> +${c} coins${extra?`<div style="font-size:16px;color:#555">${extra}</div>`:""}`;$("mdL").textContent=lvMsg;$("mDone").classList.add("on");sfx.win();speak(stars===3?"Amazing!":stars===2?"Great job!":"Good try! Practice makes your brain stronger.")}
$("mdAgain").onclick=()=>{$("mDone").classList.remove("on");openGame(curG.id)};
$("mdHome").onclick=()=>{closeGate();$("mDone").classList.remove("on");token++;show("home");renderHome()};
$("back").onclick=()=>{token++;closeGate();speechSynthesis&&speechSynthesis.cancel();show("home");renderHome()};
$("gSay").onclick=()=>speak($("instr").textContent);

/* ---------- 1. Pair Match ---------- */
const MSETS=[["🐶","🐱","🐰","🦊","🐼","🐸","🐵","🦁","🐯","🐮"],["🍎","🍌","🍇","🍓","🍉","🍒","🥕","🍪","🧁","🍩"],["🚀","🚗","🚂","✈️","🚲","⛵","🚁","🚌","🛸","🚜"]];
function playMatch(tk){const L=lv("match"),pairs=[2,3,4,6,8,10][L-1],set=shuffle(pick(MSETS)).slice(0,pairs);const cards=shuffle([...set,...set]);const cols=pairs<=2?2:pairs<=4?4:pairs<=6?4:pairs<=8?4:5;

  $("undo").onclick=()=>{if(running)return;prog.pop();drawProg()};
  $("run").onclick=async()=>{if(running||!prog.length)return;running=true;tries++;let p=[...M.s],ok=true;
    for(let i=0;i<prog.length;i++){if(tk!==token)return;drawProg(i);const [dx,dy]=DIRS[prog[i]],nx=p[0]+dx,ny=p[1]+dy;if(nx<0||ny<0||nx>=M.n||ny>=M.n||M.rocks.has(nx+","+ny)){sfx.bad();const rock=M.rocks.has(nx+","+ny);ok=false;
        await gate({emoji:"🤖",title:"Bonk!",html:`<div class="wp">Step ${i+1} (<span class="big">${prog[i]}</span>) went into ${rock?"a rock 🪨":"the edge"} ❌</div><div class="wa">Change step ${i+1}, then press Go again ✅</div>`,say:`Bonk! Step ${i+1} made the robot hit ${rock?"a rock":"the edge"}. Change that arrow so the robot goes around, then press Go again.`,btn:"Fix my plan 🔧"});
        if(tk!==token)return;prog=prog.slice(0,i);fb("Your plan is kept up to the bump. Add new arrows!","");break}p=[nx,ny];draw(p);tone(400+i*40,.08,0,"square",.05);await delay(420)}
    if(ok&&p[0]===M.g[0]&&p[1]===M.g[1]){sfx.good();fb("The robot reached the star! ⭐","good");await delay(700);finish("robot",tries===1?1:tries===2?.7:.5,tries,`Solved in ${tries} ${tries>1?"tries":"try"}`)}
    else{if(ok){sfx.bad();const dx=M.g[0]-p[0],dy=M.g[1]-p[1],need=[dx?`${Math.abs(dx)} ${dx>0?"➡️":"⬅️"}`:"",dy?`${Math.abs(dy)} ${dy>0?"⬇️":"⬆️"}`:""].filter(Boolean).join(" and ");
        await gate({emoji:"🤖",title:"Almost there!",html:`<div class="wp">The robot stopped before the star ❌</div><div class="wa">It still needs ${need} ✅</div>`,say:`The robot stopped before the star. It still needs ${[dx?`${Math.abs(dx)} ${dx>0?"right":"left"}`:"",dy?`${Math.abs(dy)} ${dy>0?"down":"up"}`:""].filter(Boolean).join(" and ")}. Add those arrows to your plan.`,btn:"Fix my plan 🔧"});if(tk!==token)return}
      draw();drawProg();running=false}}}
/* ---------- 9. Color Pad ---------- */
const PCOL=["#2b2d42","#ef233c","#ff9f1c","#ffd166","#38b000","#4361ee","#9d4edd","#f15bb5","#8d5524","#ffffff"];
const PROMPTS=["a rocket","your family","a happy sun","a monster friend","your favorite food","a big tree","a fish in the sea","a rainbow","your house","a robot"];
function playDraw(tk){let col=PCOL[1],size=10,stamp=null,strokes=0;const pr=pick(PROMPTS);$("instr").textContent=`Draw anything — or try: ${pr}!`;speak(`Draw anything you like. Or try drawing ${pr}!`);
  $("area").innerHTML=`<canvas id="pad"></canvas><div class="pal">${PCOL.map(c=>`<div class="sw ${c===col?"on":""}" data-c="${c}" style="background:${c}"></div>`).join("")}</div><div class="pal"><button class="tool on" data-s="6">✏️</button><button class="tool" data-s="16">🖌️</button><button class="tool" data-s="34">🧽</button>${["⭐","❤️","🌸","🚀","🐱","🌈"].map(e=>`<button class="tool" data-st="${e}">${e}</button>`).join("")}<button class="tool" id="clr">🗑️</button><button class="btn go" id="dDone">I'm done!</button></div>`;
  const cv=$("pad"),c=cv.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;c.scale(dpr,dpr);c.lineCap="round";c.lineJoin="round";c.fillStyle="#fff";c.fillRect(0,0,cv.width,cv.height);
  let down=false,last=null;const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=pos(e);if(stamp){c.font="44px serif";c.textAlign="center";c.textBaseline="middle";c.fillText(stamp,p[0],p[1]);sfx.tap();strokes++;return}down=true;last=p;strokes++};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);c.strokeStyle=size===34?"#fff":col;c.lineWidth=size;c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p};
  cv.onpointerup=()=>{down=false};
  document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{col=s.dataset.c;stamp=null;document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===s));document.querySelectorAll(".tool[data-st]").forEach(x=>x.classList.remove("on"))});
  document.querySelectorAll(".tool[data-s]").forEach(t=>t.onclick=()=>{size=+t.dataset.s;stamp=null;document.querySelectorAll(".tool").forEach(x=>x.classList.toggle("on",x===t))});
  document.querySelectorAll(".tool[data-st]").forEach(t=>t.onclick=()=>{stamp=t.dataset.st;document.querySelectorAll(".tool").forEach(x=>x.classList.toggle("on",x===t))});
  $("clr").onclick=()=>{c.fillStyle="#fff";c.fillRect(0,0,cv.width,cv.height)};
  $("dDone").onclick=()=>{if(strokes<5){fb("Add a little more to your drawing first! 🖍️","");return}const s=st("draw");s.rounds++;s.stars+=3;s.m.push(strokes);const d=S.days[today()]||(S.days[today()]={rounds:0});d.rounds++;
    const last=S.drawAt||0;let c2=0;if(Date.now()-last>120000){c2=5;S.coins+=5;S.drawAt=Date.now()}save();setCoins();
    try{if(c2&&window.parent!==window&&window.parent.fhAward)window.parent.fhAward("brain",`draw:${Date.now()}`,1,"Brain Park drawing","大脑乐园 画画")}catch(e){}
    $("mdE").textContent="🎨";$("mdT").textContent="What a great picture!";$("mdS").innerHTML="";$("mdC").innerHTML=c2?`<span class="coin" style="vertical-align:middle"></span> +5 coins`:"";$("mdL").textContent="Show it to Mom or Dad!";$("mDone").classList.add("on");sfx.win();speak("What a great picture! Show it to Mom or Dad!")}}
/* ---------- 10. Music Maker ---------- */
const NOTES=[["C",262,"#ef233c"],["D",294,"#ff9f1c"],["E",330,"#ffd166"],["F",349,"#38b000"],["G",392,"#06d6a0"],["A",440,"#4361ee"],["B",494,"#7209b7"],["C",523,"#f15bb5"]];
const SONGS=[["Hot Cross Buns","EDC EDC CCCC DDDD EDC"],["Mary Had a Little Lamb","EDCDEEE DDD EGG EDCDEEE EDDEDC"],["Twinkle Twinkle","CCGGAAG FFEEDDC GGFFEED GGFFEED CCGGAAG FFEEDDC"]];
function playMusic(tk){const L=lv("music");
  $("area").innerHTML=`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="mFree">🎹 Free play</button><button class="btn" id="mSong">🎼 Play a song</button><button class="btn go" id="mBeat">🥁 Copy the beat</button></div><div id="mArea" style="margin-top:10px"></div>`;
  const xylo=()=>{$("mArea").innerHTML=`<div class="xylo">${NOTES.map((n,i)=>`<button class="bar" data-i="${i}" style="background:${n[2]};height:${230-i*16}px">${n[0]}</button>`).join("")}</div>`;return [...document.querySelectorAll(".bar")]};
  const hit=(b,i)=>{tone(NOTES[i][1],.5,0,"sine",.2);tone(NOTES[i][1]*2,.3,0,"sine",.05);b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),120)};
  $("mFree").onclick=()=>{$("instr").textContent="Play anything you like! 🎶";const bars=xylo();bars.forEach((b,i)=>b.onpointerdown=()=>hit(b,i))};
  $("mSong").onclick=()=>{const [name,notes]=SONGS[Math.min(SONGS.length-1,Math.floor((L-1)/1.5))];const seq=notes.replace(/ /g,"").split("");let k=0,mist=0;$("instr").textContent=`🎼 ${name}: tap the bouncing bar`;speak(`Let's play ${name}. Tap the bouncing bar.`);const bars=xylo();
    const idx=ch=>ch==="C"?0:NOTES.findIndex(n=>n[0]===ch);const mark=()=>{bars.forEach(b=>b.classList.remove("hl"));if(k<seq.length)bars[idx(seq[k])].classList.add("hl")};mark();
    bars.forEach((b,i)=>b.onpointerdown=()=>{hit(b,i);if(k>=seq.length)return;if(i===idx(seq[k])){k++;mark();if(k===seq.length){fb("You played the whole song! 🎉","good");setTimeout(()=>finish("music",Math.max(.6,1-mist*.05),{song:name,mist},`${name}`),900)}}else mist++})};
  $("mBeat").onclick=async()=>{const n=Math.min(3+L,7);$("mArea").innerHTML=`<div class="beats" id="bt"></div><button class="drum" id="dr">🥁</button>`;let rounds=3,good=0;
    for(let r=0;r<rounds&&tk===token;r++){const gaps=Array.from({length:n-1},()=>pick([400,400,800]));$("instr").textContent=`👂 Listen… (${r+1}/${rounds})`;$("bt").textContent="";await delay(700);
      const times=[0];gaps.forEach(g=>times.push(times[times.length-1]+g));for(let i=0;i<n;i++){setTimeout(()=>{tone(180,.15,0,"triangle",.3);$("bt").textContent+="🔵";$("dr").classList.add("hit");setTimeout(()=>$("dr").classList.remove("hit"),90)},times[i])}
      await delay(times[n-1]+700);$("bt").textContent="";$("instr").textContent="🥁 Your turn! Tap the drum the same way";const taps=[];
      await new Promise(res=>{let to=null;$("dr").onpointerdown=()=>{tone(200,.15,0,"triangle",.3);taps.push(Date.now());$("bt").textContent+="🟢";clearTimeout(to);if(taps.length>=n){$("dr").onpointerdown=null;setTimeout(res,300)}else to=setTimeout(()=>{$("dr").onpointerdown=null;res()},2500)}});
      let ok=taps.length===n;if(ok){const tg=taps.slice(1).map((t,i)=>t-taps[i]);ok=tg.every((g,i)=>Math.abs(g-gaps[i])<Math.max(220,gaps[i]*.45))}
      if(ok){good++;sfx.good();fb("Perfect rhythm! 🎵","good");await delay(1000)}else{sfx.bad();fb("");const pat=gaps.map(g=>g>500?"slow":"fast");
        await gate({emoji:"🥁",title:"Listen to the beat",html:`<div class="wp">You tapped ${taps.length} time${taps.length===1?"":"s"}</div><div class="wa">The beat had ${n} taps: ${"🔵".repeat(n)}</div>${taps.length===n?`<div>Match the slow and fast gaps: ${pat.join(", ")}</div>`:""}`,say:taps.length!==n?`You tapped ${taps.length} times. The beat had ${n} taps. Count them while you listen.`:`You had the right number of taps. Now match the slow and fast gaps: ${pat.join(", ")}.`,btn:"Next beat 🥁"});if(tk!==token)return}}
    if(tk===token)finish("music",good/rounds,{beat:good/rounds},`${good}/${rounds} beats copied`)}}

/* ---------- parents ---------- */
function measure(id){const m=(S.st[id]||{}).m||[];if(!m.length)return "–";const last=m.slice(-5);const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  if(id==="match")return `${avg(last).toFixed(1)} tries per pair (lower = better memory)`;
  if(id==="simon")return `memory span ${Math.max(...last)} lights`;
  if(id==="odd")return `find time ${(avg(last.filter(x=>x))/1000||0).toFixed(1)} s`;
  if(id==="gonogo"){const im=avg(last.map(x=>x.impulse||0)),rt=avg(last.map(x=>x.rt||0));return `impulse taps ${im.toFixed(1)}/round · reaction ${Math.round(rt)} ms`}
  if(id==="switch"){const sw=last.map(x=>x.sw).filter(x=>x!=null);return `accuracy ${Math.round(avg(last.map(x=>x.acc))*100)}%${sw.length?` · after switch ${Math.round(avg(sw)*100)}%`:""}`}
  if(id==="pattern")return `accuracy ${Math.round(avg(last)*100)}%`;if(id==="shapes")return `${avg(last).toFixed(1)} wrong drops`;if(id==="robot")return `${avg(last).toFixed(1)} tries per puzzle`;
  if(id==="draw")return `${m.length} drawings`;if(id==="music"){const b=last.filter(x=>x.beat!=null);return b.length?`beat copying ${Math.round(avg(b.map(x=>x.beat))*100)}%`:"songs played"}return "–"}
function renderParents(){$("pTable").innerHTML=GAMES.map(g=>{const s=S.st[g.id];return `<tr><td>${g.ic} ${g.n}</td><td>${g.id==="draw"?"–":lv(g.id)+"/"+g.max}</td><td>${s?s.rounds:0}</td><td>${s&&s.rounds?(s.stars/s.rounds).toFixed(1):"–"}</td><td>${measure(g.id)}</td></tr>`}).join("");$("sVoice").value=S.voice;$("pMsg").textContent=""}
$("toParents").onclick=()=>{renderParents();show("parents")};$("pBack").onclick=()=>{show("home");renderHome()};
$("sVoice").onchange=e=>{S.voice=+e.target.value;save()};
$("pCopy").onclick=async()=>{const t=[`${NAME} — Brain Park (${today()})`,`Coins: ${S.coins}`,...GAMES.map(g=>{const s=S.st[g.id];return `${g.n}: level ${g.id==="draw"?"-":lv(g.id)}, ${s?s.rounds:0} rounds, ${measure(g.id)}`})].join("\n");try{await navigator.clipboard.writeText(t);$("pMsg").textContent="Copied."}catch(e){$("pMsg").textContent=t}};
if(!IS_PARENT)$("toParents").style.display="none";
renderHome();save();
</script>

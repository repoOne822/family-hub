<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><script>if(window.top===window){location.replace("../#robot");}</script>
<title>Robot Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c24;--panel:#1f1640;--panel2:#2a1f55;--ink:#f5f0ff;--mute:#b8aee0;--mars:#e2683c;--sand:#f3b37a;--lime:#b8f34a;--sky:#5cc8ff;--pink:#ff6fb5;--gold:#ffd166;--line:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#3b1d5e 0%,var(--bg) 60%) fixed;color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;font-size:17px;line-height:1.4}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.top h1{margin:0;font-size:28px}.spacer{flex:1}
.pill{background:var(--panel2);border-radius:999px;padding:4px 12px;font-weight:700}
.btn{border:3px solid var(--line);border-radius:14px;padding:8px 14px;background:var(--gold);color:#241500;font-weight:800;box-shadow:3px 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}.btn.ghost{background:var(--panel2);color:var(--ink)}.btn.go{background:var(--lime);color:#122000}.btn.pink{background:var(--pink);color:#2a0016}.btn.sky{background:var(--sky);color:#002235}
.btn.sm{padding:4px 10px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--line)}.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:16px;box-shadow:5px 5px 0 var(--line);margin:12px 0}
.sub{color:var(--mute);font-size:15px}
/* mission map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.planet{position:relative;text-align:left;border:3px solid var(--line);border-radius:20px;padding:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));color:var(--ink);box-shadow:5px 5px 0 var(--line)}
.planet .em{font-size:40px}.planet h3{margin:2px 0;font-size:21px}.planet.lock{opacity:.5}.planet .prog{height:8px;background:#0006;border-radius:9px;overflow:hidden;margin-top:8px}.planet .prog i{display:block;height:100%;background:var(--lime)}
.planet .tag{position:absolute;right:12px;top:10px;font-size:13px;background:#0005;border-radius:999px;padding:2px 9px}
/* lesson */
.lesson .idea{font-size:19px;margin:8px 0}.codebox{background:#0d0920;border:2px solid #000;border-radius:12px;padding:10px 12px;font:15px/1.5 "JetBrains Mono",ui-monospace,monospace;white-space:pre;overflow-x:auto;color:#e8e3ff}
.note{background:#ffffff12;border-left:5px solid var(--sky);padding:8px 12px;border-radius:8px;margin-top:10px}
.dots{display:flex;gap:6px;margin:8px 0}.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff30}.dots i.on{background:var(--gold)}
/* item list */
.items{display:grid;gap:8px}.item{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel2);color:var(--ink)}
.item .ic{font-size:24px;width:34px;text-align:center}.item .st{margin-left:auto;font-size:18px;letter-spacing:2px}.item.lock{opacity:.45}.item.boss{background:linear-gradient(90deg,#5b2a00,#2a1f55)}
/* level */
.lvl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:900px){.lvl{grid-template-columns:1fr}}
.world{position:relative;margin:0 auto;border:3px solid #000;border-radius:12px;overflow:hidden;background:#000}
.cell{position:absolute;display:flex;align-items:center;justify-content:center}
.cell.floor{background:#c9744a;box-shadow:inset 0 0 0 1px #b8653f}.cell.wall{background:linear-gradient(135deg,#5a3a2e,#3b241c);box-shadow:inset 0 0 0 1px #2a1912}
.cell.line::after{content:"";position:absolute;inset:32%;background:#1b1b1b;border-radius:4px}
.cell.trail::before{content:"";width:18%;height:18%;border-radius:50%;background:#ffffff80;position:absolute}
.cell .ob{position:relative;z-index:2}
.robot{position:absolute;display:flex;align-items:center;justify-content:center;transition:left .18s ease,top .18s ease;z-index:5}
.robot .body{filter:drop-shadow(0 3px 2px #0008)}.robot .dirw{position:absolute;inset:0;transition:transform .18s ease}.robot .dir{position:absolute;right:-14%;top:50%;transform:translateY(-50%);font-size:45%;color:var(--gold);text-shadow:0 0 3px #000,0 0 6px #000}
.robot .eye{position:absolute;width:30%;height:30%;font-size:60%;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 0 4px #000}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spark{position:absolute;z-index:6;pointer-events:none;animation:spark .7s forwards}@keyframes spark{to{transform:translateY(-30px);opacity:0}}
.wtabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.wtabs button{border:2px solid #000;border-radius:10px;background:var(--panel2);color:var(--ink);padding:2px 10px}.wtabs button.on{background:var(--sky);color:#002235}.wtabs .ok{color:var(--lime)}.wtabs .no{color:#ff8f8f}
/* editor */
.ed{position:relative;border:3px solid #000;border-radius:12px;background:#0d0920;overflow:hidden}
.ed .gut{position:absolute;left:0;top:0;bottom:0;width:38px;background:#1a1236;color:#6e64a3;font:15px/1.55 "JetBrains Mono",monospace;text-align:right;padding:10px 6px 10px 0;overflow:hidden;white-space:pre}
.ed .hl,.ed textarea{font:15px/1.55 "JetBrains Mono",ui-monospace,monospace;padding:10px 10px 10px 46px;margin:0;border:0;white-space:pre;tab-size:4;overflow:auto;width:100%;min-height:260px;letter-spacing:0}
.ed .hl{position:absolute;inset:0;pointer-events:none;color:#e8e3ff}
.ed textarea{position:relative;background:transparent;color:transparent;caret-color:#fff;resize:vertical;outline:none;height:280px;display:block}
.ed textarea::selection{background:#5cc8ff55;color:transparent}
.k{color:#ff79c6;font-weight:600}.f{color:#8be9fd}.n{color:#bd93f9}.s{color:#f1fa8c}.c{color:#6e64a3;font-style:italic}.sens{color:#50fa7b}
.curline{background:#ffd16633;display:inline-block;width:100%}.errline{background:#ff5c5c44;display:inline-block;width:100%}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.palette button{border:2px solid #000;border-radius:10px;padding:3px 9px;font:14px "JetBrains Mono",monospace;background:#2f2560;color:#fff}
.palette button.cmd{background:#21406b}.palette button.blk{background:#5a2364}.palette button.sns{background:#1f5a3a}
.runbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.out{background:#000;border:2px solid #333;border-radius:10px;padding:8px 10px;font:14px/1.5 "JetBrains Mono",monospace;min-height:38px;color:#9cff9c;white-space:pre-wrap;margin-top:8px}
.msg{border:3px solid #000;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:17px}.msg.err{background:#4a1022}.msg.ok{background:#14401f}.msg.info{background:#16325a}
.goal{background:#ffffff12;border-radius:12px;padding:8px 12px;margin:6px 0 10px;font-size:18px}
.hintbox{background:#3a2a00;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;margin-top:8px}.hintbox pre{margin:6px 0 0;font:14px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap}
.choices{display:grid;gap:8px;margin-top:10px}.choices button{text-align:left;border:3px solid #000;border-radius:12px;padding:10px 12px;background:var(--panel2);color:var(--ink);font-size:18px}
.choices button.right{background:#1f6b35}.choices button.wrong{background:#7a1f2c}
.stars{font-size:34px;letter-spacing:6px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.modal .card{max-width:520px;width:100%;text-align:center}
.skins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.skins button{font-size:34px;width:64px;height:64px;border:3px solid #000;border-radius:14px;background:var(--panel2)}.skins button.on{background:var(--gold)}.skins button:disabled{opacity:.35}
.ref td{padding:3px 8px;vertical-align:top}.ref code{font:14px "JetBrains Mono",monospace;color:#8be9fd}
.conf{position:fixed;top:-20px;z-index:60;font-size:22px;animation:fall 2.2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.speed{accent-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="engine.js?v=1"></script>
<script src="levels1.js?v=1"></script>
<script src="levels2.js?v=1"></script>
<script src="cpgen.js?v=20261123el1"></script>
<script>
(function () {
"use strict";
const E = window.RoboEngine, CH = window.ROBO_CHAPTERS;
const Q = new URLSearchParams(location.search), KID = (Q.get("k") || "ellis").toLowerCase().replace(/[^a-z]/g, "") || "ellis", PARENT = Q.get("p") === "1";
const NAME = KID[0].toUpperCase() + KID.slice(1), LS = `${KID}_robot_state`;
let S; try { S = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {} S = S || {};
S.done = S.done || {}; S.seen = S.seen || {}; S.code = S.code || {}; S.log = S.log || []; S.skin = S.skin || "🤖"; S.sound = S.sound !== false; S.days = S.days || {};
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const $ = s => document.querySelector(s), app = $("#app");
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ALL = CH.flatMap(c => c.items.map(it => Object.assign({ ch: c }, it)));
const stars = id => (S.done[id] && S.done[id].stars) || 0, totalStars = () => Object.values(S.done).reduce((a, d) => a + (d.stars || 0), 0), maxStars = ALL.length * 3;
const today = () => new Date().toLocaleDateString("en-CA");
// unlocks: a chapter opens when the one before has every item solved; inside a chapter, items open in order
const chDone = c => c.items.every(it => stars(it.id) > 0);
// 🏁 Light checkpoints (Bobby 11/23): after every puzzle in a chapter is solved, a 5-question "Code check" (read the code, never the same
// questions twice) must be passed (4/5) to open the next chapter. Chapters he had already opened stay open; nothing is taken away.
// Points come only from code checks: 20 (+5 for 5/5). A miss: see every answer, try again in 30 min with new questions.
S.cp = S.cp || {}; S.cpAsked = S.cpAsked || [];
const RCP = { n: 5, pass: 4, cool: 30, pts: 20, bonus: 5 };
const cpOk = c => !!(S.cp[c.id] && S.cp[c.id].passed);
const cpWait = c => { const x = S.cp[c.id]; return x && !x.passed && x.failAt ? Math.max(0, x.failAt + RCP.cool * 60e3 - Date.now()) : 0; };
const wasOpen = c => !!S.seen[c.id] || c.items.some(it => stars(it.id) > 0);
const chOpen = (c, i) => PARENT || i === 0 || wasOpen(c) || (chDone(CH[i - 1]) && cpOk(CH[i - 1]));
const hubAward = (ref, pts, label, zh) => { try { if (window.parent !== window && window.parent.fhAward) window.parent.fhAward("robot", ref, pts, label, zh); } catch (e) {} };
const itemOpen = (c, k) => PARENT || k === 0 || stars(c.items[k - 1].id) > 0;
// ---------- sound ----------
let AC = null; const beep = (f, d, type, vol) => { if (!S.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "square"; o.frequency.value = f; g.gain.value = vol || .04; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (d || .08)); o.stop(AC.currentTime + (d || .08)); } catch (e) {} };
const SFX = { move: () => beep(330, .05), turn: () => beep(440, .04, "triangle"), pick: () => { beep(660, .07, "sine", .06); setTimeout(() => beep(990, .09, "sine", .06), 70); }, crash: () => beep(90, .3, "sawtooth", .08), win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .15, "triangle", .07), i * 120)), err: () => beep(160, .2, "square", .05) };
const confetti = () => { for (let i = 0; i < 40; i++) { const d = document.createElement("div"); d.className = "conf"; d.textContent = ["⭐", "🔋", "✨", "🚀", "🤖"][i % 5]; d.style.left = Math.random() * 100 + "vw"; d.style.animationDelay = Math.random() * .6 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 2900); } };
// ---------- skins (unlocked by stars) ----------
const SKINS = [["🤖", 0], ["🚙", 8], ["🦾", 20], ["🐶", 35], ["🛸", 55], ["🦖", 80], ["🚀", 110], ["👾", 135]];
// ---------- syntax highlight ----------
const KWS = new Set(["def", "for", "in", "while", "if", "elif", "else", "and", "or", "not", "True", "False", "pass", "break", "continue", "return", "None"]);
const SNS = new Set(["wall_ahead", "wall_left", "wall_right", "path_ahead", "at_goal", "on_battery", "line_ahead", "line_left", "line_right", "batteries"]);
function hlLine(line) {
  let out = "", i = 0;
  while (i < line.length) {
    const c = line[i];
    if (c === "#") { out += `<span class="c">${esc(line.slice(i))}</span>`; break; }
    if (c === '"' || c === "'") { let j = line.indexOf(c, i + 1); if (j < 0) j = line.length - 1; out += `<span class="s">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue; }
    if (/[0-9]/.test(c)) { let j = i; while (j < line.length && /[0-9]/.test(line[j])) j++; out += `<span class="n">${line.slice(i, j)}</span>`; i = j; continue; }
    if (/[A-Za-z_]/.test(c)) { let j = i; while (j < line.length && /[A-Za-z0-9_]/.test(line[j])) j++; const w = line.slice(i, j);
      out += KWS.has(w) || w === "range" ? `<span class="k">${w}</span>` : SNS.has(w) ? `<span class="sens">${w}</span>` : line[j] === "(" ? `<span class="f">${w}</span>` : esc(w); i = j; continue; }
    out += esc(c); i++;
  }
  return out;
}
const hlCode = (code, cur, err) => code.split("\n").map((l, i) => { const h = hlLine(l) || " "; return i + 1 === cur ? `<span class="curline">${h}</span>` : i + 1 === err ? `<span class="errline">${h}</span>` : h; }).join("\n");
// ---------- screens ----------
function header(title, back) {
  return `<div class="top">${back ? `<button class="btn ghost sm" id="back">← ${back}</button>` : ""}<h1>${title}</h1><span class="spacer"></span>
    <span class="pill">⭐ ${totalStars()} / ${maxStars}</span><button class="btn ghost sm" id="skinBtn">${S.skin} Skins</button><button class="btn ghost sm" id="refBtn">📘 Cheat sheet</button><button class="btn ghost sm" id="sndBtn">${S.sound ? "🔊" : "🔈"}</button></div>`;
}
function wireHeader(back) {
  if ($("#back")) $("#back").onclick = back;
  $("#skinBtn").onclick = skinModal; $("#refBtn").onclick = refModal;
  $("#sndBtn").onclick = () => { S.sound = !S.sound; save(); $("#sndBtn").textContent = S.sound ? "🔊" : "🔈"; };
}
function home() {
  window.scrollTo(0, 0);
  const next = ALL.find(it => !stars(it.id));
  app.innerHTML = header(`🤖 ${esc(NAME)}'s Robot Lab`) + `
    <div class="card"><b style="font-size:20px">🛰️ Mission: rescue Mars Base!</b><p class="sub" style="margin:4px 0">You're learning <b>Python</b>, the real programming language used by NASA, robotics engineers and MIT students. Every level teaches one idea. Read the lesson cards, write the code, and watch your robot do it.</p>
    ${next ? `<button class="btn go" id="cont">▶ Continue: ${esc(next.ch.emoji)} ${esc(next.title)}</button>` : `<b>🏆 Every mission complete! You're a real robot programmer.</b>`}</div>
    <div class="map">${CH.map((c, i) => { const open = chOpen(c, i), got = c.items.filter(it => stars(it.id)).length, st = c.items.reduce((a, it) => a + stars(it.id), 0);
      return `<button class="planet ${open ? "" : "lock"}" data-c="${i}" ${open ? "" : "disabled"}><span class="tag">${open ? (got === c.items.length ? (cpOk(c) ? "🏁 passed" : "🏁 code check") : `${got}/${c.items.length}`) : "🔒"}</span><div class="em">${c.emoji}</div><h3>${c.n}. ${esc(c.title)}</h3>
        <div class="sub">${esc(c.story.split(". ")[0])}.</div><div class="sub">⭐ ${st} / ${c.items.length * 3}</div><div class="prog"><i style="width:${Math.round(got / c.items.length * 100)}%"></i></div></button>`; }).join("")}</div>
    <p class="sub" style="margin-top:14px">🎓 Robots at MIT, at NASA and in FIRST robotics all run on these same ideas: commands, loops, functions, sensors, decisions, variables and algorithms.</p>`;
  wireHeader();
  if ($("#cont")) $("#cont").onclick = () => { const c = next.ch; if (!S.seen[c.id]) lessons(c, 0); else play(next.id); };
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => chapter(CH[+b.dataset.c]));
}
function chapter(c) {
  window.scrollTo(0, 0);
  if (!S.seen[c.id] && !PARENT) return lessons(c, 0);
  app.innerHTML = header(`${c.emoji} ${c.n}. ${esc(c.title)}`, "Mission map") + `
    <div class="card"><p style="margin:0">${esc(c.story)}</p><div class="row" style="margin-top:8px"><button class="btn sky sm" id="les">📖 Lesson cards (${c.lessons.length})</button></div></div>
    <div class="items">${c.items.map((it, k) => { const open = itemOpen(c, k), st = stars(it.id);
      return `<button class="item ${open ? "" : "lock"} ${it.boss ? "boss" : ""}" data-i="${esc(it.id)}" ${open ? "" : "disabled"}><span class="ic">${it.type === "predict" ? "🔮" : it.type === "debug" ? "🐞" : it.boss ? "🌟" : "🛠️"}</span>
        <span><b>${esc(it.title)}</b><br><span class="sub">${it.type === "predict" ? "Predict: read the code" : it.type === "debug" ? "Debug: fix the code" : "Build: write the code"}</span></span>
        <span class="st">${open ? "★".repeat(st) + "☆".repeat(3 - st) : "🔒"}</span></button>`; }).join("")}</div>
    ${cpCard(c)}`;
  wireHeader(home);
  if ($("#cpGo")) $("#cpGo").onclick = () => codeCheck(c);
  $("#les").onclick = () => lessons(c, 0);
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => play(b.dataset.i));
}
function cpCard(c) {
  const x = S.cp[c.id] || {}, w = cpWait(c), i = CH.indexOf(c), nx = CH[i + 1];
  if (cpOk(c)) return `<div class="card" style="margin-top:12px;background:#e3fbe9">🏁 <b>Code check passed</b> on ${x.passed} (${x.score}/${RCP.n}).${nx ? ` Chapter ${nx.n} is open.` : ""}</div>`;
  return `<div class="card" style="margin-top:12px;border:2px solid #ff5ccb">🏁 <b>Code check</b>: ${RCP.n} brand-new "read the code" questions. No running the code! Pass with ${RCP.pass}/${RCP.n} to ${nx ? `open Chapter ${nx.n} and ` : ""}earn <b>${RCP.pts} points</b>.${x.best != null ? ` Best so far: ${x.best}/${RCP.n}.` : ""}<br>
    ${!chDone(c) && !PARENT ? `<span class="sub">Solve every puzzle in this chapter first.</span>` : w && !PARENT ? `<span class="sub">⏳ Look at your answers, then try again in ${Math.ceil(w / 60000)} min with new questions.</span>` : `<button class="btn go" id="cpGo" style="margin-top:8px">🏁 Start the code check</button>`}</div>`;
}
function codeCheck(c) {
  const qs = window.ROBO_CP ? ROBO_CP.make(c.id, RCP.n, new Set(S.cpAsked)) : [];
  if (qs.length < RCP.n) { app.innerHTML = header("🏁 Code check", c.title) + `<div class="card">Couldn't make enough new questions right now. Try again later.</div>`; wireHeader(() => chapter(c)); return; }
  S.cpAsked.push(...qs.map(q => q.key)); if (S.cpAsked.length > 3000) S.cpAsked = S.cpAsked.slice(-3000); save(); window.__lastCP = qs;
  const res = []; let k = 0; const t0 = Date.now();
  const draw = () => {
    const q = qs[k], shown = Date.now();
    app.innerHTML = header(`🏁 Code check · ${esc(c.title)} · ${k + 1}/${qs.length}`, c.title) + `
      <div class="goal">🔮 Read the code. Don't run it! Think like the robot, one line at a time.</div>
      <div class="lvl"><div><div style="overflow-x:auto"><div id="wv"></div></div></div>
      <div><div class="codebox">${hlCode(q.code)}</div><h3 style="margin:12px 0 4px">${esc(q.q)}</h3>
        <div class="choices">${q.c.map((t, i) => `<button data-a="${i}">${String.fromCharCode(65 + i)}. ${esc(t)}</button>`).join("")}</div></div></div>`;
    wireHeader(() => chapter(c)); makeView($("#wv"), q.map, 34);
    app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const j = +b.dataset.a, ok = j === q.a, secs = Math.round((Date.now() - shown) / 1000);
      res.push({ j, ok }); S.log.push({ ts: Date.now(), d: today(), id: c.id + "cp", ok, secs, cp: 1 }); save(); k++; k < qs.length ? draw() : finish(); });
  };
  const finish = () => {

    const st = tries === 1 ? 3 : tries === 2 ? 2 : 1, rec = S.done[it.id] || {};

    S.log.push({ ts: Date.now(), d: today(), id: it.id, ok: true, st, tries }); save(); SFX.win();
    const nx = nextItem(it);
    $("#msg").innerHTML = `<div class="msg ok"><div class="stars" style="font-size:26px">${"★".repeat(st)}${"☆".repeat(3 - st)}</div>✅ ${esc(it.why)}<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sky sm" id="watch">▶ Watch it run</button>${nx ? `<button class="btn go sm" id="pNext">Next ▶</button>` : ""}</div></div>`;
    $("#watch").onclick = () => { const r = E.run(it.code, it.map, {}); animate(view, r.frames, 300, f => { $("#out").textContent = f.out.join("\n"); }, () => { if (r.error) $("#out").textContent += "\n⚠️ " + r.error.message; }); };
    if ($("#pNext")) $("#pNext").onclick = () => { const ch = nx.ch; if (!S.seen[ch.id]) lessons(ch, 0); else play(nx.id); };
  });
}
// ---------- modals ----------
function skinModal() {
  const t = totalStars();
  document.body.insertAdjacentHTML("beforeend", `<div class="modal" id="sk"><div class="card"><h2 style="margin:0 0 8px">Choose your robot</h2><p class="sub">Earn ⭐ to unlock more. You have ${t}.</p>
    <div class="skins">${SKINS.map(([e, n]) => `<button data-k="${e}" class="${S.skin === e ? "on" : ""}" ${t >= n || PARENT ? "" : "disabled"} title="${n} stars">${e}</button>`).join("")}</div>
    <p class="sub">${SKINS.filter(([e, n]) => n > t).slice(0, 1).map(([e, n]) => `Next: ${e} at ${n} ⭐`).join("")}</p><button class="btn" id="skX">Done</button></div></div>`);
  $("#sk").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { S.skin = b.dataset.k; save(); $("#sk").remove(); const r = document.querySelector(".robot .body"); if (r) r.textContent = S.skin; $("#skinBtn").textContent = S.skin + " Skins"; });
  $("#skX").onclick = () => $("#sk").remove();
}

    ["for i in range(5):", "Repeat the pushed-in lines 5 times (i = 0, 1, 2, 3, 4)"], ["def name():", "Make your own command. Call it with name()"], ["if …: / elif …: / else:", "Choose what to do. Only one part runs"],
    ["while …:", "Repeat while the question is True"], ["not", "Flip True ↔ False"], ["x = 0 · x += 1", "Put a value in a box · add 1 to it"], ["== != < > <= >=", "Compare (two = to compare!)"],
    ["wall_ahead() wall_left() wall_right()", "Sensors: is there a wall there? (True/False)"], ["path_ahead()", "Is the square ahead open?"], ["on_battery() · at_goal()", "Am I on a battery? Am I on the flag?"], ["line_ahead() line_left() line_right()", "Light sensors: is the line there?"],
    ["# comment", "A note for humans. The robot ignores it"], [": and 4 spaces", "Every if/for/while/def line ends with : and its inside is pushed in 4 spaces"]];

    <table class="ref">${rows.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td></tr>`).join("")}</table><div style="text-align:center;margin-top:10px"><button class="btn" id="rfX">Got it</button></div></div></div>`);

home();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script>if (window.top === window) location.replace("../");</script>
<title>Pre-Algebra practice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161d;--bg:#eef6ff;--lime:#c4f53a;--yellow:#ffe066;--good:#2fbf71;--bad:#ff5a5a}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45}
button,input,select{font:inherit}
#app{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px}.top h1{margin:0;font-size:28px;flex:1}
.pill{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:600}
.sub{color:#555;font-size:16px}
.btn{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:10px 18px;font-weight:600;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn.go{background:var(--lime)}.btn[disabled]{opacity:.5}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--ink);margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:18px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.tile .em{font-size:32px}.tile .t{font-weight:700}.tile .pg{font-size:13px;opacity:.7}
.bar{height:10px;border:2px solid var(--ink);border-radius:9px;margin:6px 0;overflow:hidden;background:#f2f2f2}.bar i{display:block;height:100%;background:var(--good)}
.q{font-size:21px;font-weight:600;margin:10px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:10px 14px;cursor:pointer}
.opt.right{background:#c9f7dc}.opt.wrong{background:#ffd3d3}
.numrow{display:flex;gap:10px;flex-wrap:wrap}.numrow input{flex:1;min-width:140px;border:3px solid var(--ink);border-radius:12px;padding:10px}.numrow select{border:3px solid var(--ink);border-radius:12px;padding:8px}
.fb{margin-top:14px;border-radius:14px;padding:12px;border:3px solid var(--ink)}.fb.good{background:#e3fbe9}.fb.bad{background:#fff0f0}.fb .btn{margin-top:10px}
.parent table{border-collapse:collapse;width:100%;font-size:15px}.parent td,.parent th{border-bottom:1px solid #ddd;padding:5px;text-align:left}
.units{display:grid;gap:14px;margin-top:18px}
.unit{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink)}
.unit.now{background:#fffbe0}.unit.next{opacity:.85}
.uh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#eee}.chip.now{background:var(--yellow)}.chip.done{background:#c9f7dc}
.ub{display:flex;gap:10px;margin-top:8px}.btn.sm{padding:6px 12px;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script src="../quest/gen.js?v=20261123st1"></script>
<script>window.SUBJ = "prealg";</script>
<script src="../review/banks.js?v=20261123st1"></script>
<script src="../study/data.js?v=20261123st2"></script>
<script src="../study/more.js?v=20261123st2"></script>
<script src="../study/study.js?v=20261123st2"></script>
</body>
</html>

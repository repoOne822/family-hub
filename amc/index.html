<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script>if (window.top === window) location.replace("../");</script>
<title>AMC 8 Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161d;--bg:#fff8ec;--card:#fff;--lime:#c4f53a;--pink:#ff5ccb;--orange:#ff8a3d;--blue:#5cc8ff;--yellow:#ffe066;--purple:#8a6bff;--good:#2fbf71;--bad:#ff5a5a;--line:#16161d}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45;background-image:radial-gradient(#00000012 1px,transparent 1px);background-size:18px 18px}
button{font:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:30px;font-weight:700;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;box-shadow:3px 3px 0 var(--line)}
.btn{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 18px;font-weight:600;box-shadow:4px 4px 0 var(--line);transition:transform .1s}
.btn:hover{transform:translate(-1px,-1px)} .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.go{background:var(--lime)} .btn.alt{background:var(--blue)} .btn.pink{background:var(--pink);color:#fff}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.sub{color:#555;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:18px}
.tile{position:relative;text-align:left;border:3px solid var(--line);border-radius:22px;padding:14px 14px 12px;box-shadow:5px 5px 0 var(--line);background:#fff;transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile .em{font-size:38px;line-height:1}
.tile .n{font-size:13px;font-weight:600;opacity:.7;margin-top:6px}
.tile .t{font-size:19px;font-weight:700;line-height:1.2}
.tile .z{font-size:14px;opacity:.75}
.tile .st{margin-top:8px;font-size:18px;letter-spacing:2px}
.tile .wk{position:absolute;top:10px;right:10px;background:var(--pink);color:#fff;border:2px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px}
.tile .pg{font-size:12.5px;opacity:.65}
.c1{background:#e8ffd0}.c2{background:#ffe3f5}.c3{background:#dff3ff}.c4{background:#fff1c9}.c5{background:#ece6ff}.c6{background:#ffe6d6}
.card{background:#fff;border:3px solid var(--line);border-radius:24px;padding:20px;box-shadow:6px 6px 0 var(--line);margin-top:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.steps button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14.5px;font-weight:600}
.steps button.on{background:var(--ink);color:var(--yellow)}
.steps button.done{background:var(--lime)}
.big{font-size:64px;line-height:1;text-align:center}
.six p{font-size:21px;margin:14px 0}
.six p:first-of-type{margin-top:6px}
.move{display:flex;gap:12px;align-items:flex-start;border:2px dashed #0003;border-radius:16px;padding:12px 14px;margin-top:10px;background:#fffdf6}
.move b{background:var(--yellow);border:2px solid var(--line);border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center}
.q{font-size:21px;font-weight:600}
.step{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:16px;border:2px solid var(--line)}
.step.new{animation:pop .25s}
.ch button:disabled{color:var(--ink);cursor:default}
.step .lb{font-weight:700;white-space:nowrap}
.s0{background:#dff3ff}.s1{background:#ece6ff}.s2{background:#ffe3f5}.s3{background:#e8ffd0}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.ch{display:grid;gap:10px;margin-top:14px}
.ch button{text-align:left;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-size:19px;display:flex;gap:12px;align-items:center;box-shadow:3px 3px 0 var(--line)}
.ch button .L{background:var(--ink);color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-weight:700;flex:none}
.ch button.right{background:#d6f7e4;border-color:var(--good)} .ch button.right .L{background:var(--good)}
.ch button.wrong{background:#ffe0e0;border-color:var(--bad);animation:shake .3s} .ch button.wrong .L{background:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:14px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);font-size:18px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.word{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fffdf6}
.word .wt{font-weight:700;font-size:19px}
.word .eg{margin-top:6px;font-size:15.5px;color:#555;background:#f3efe4;border-radius:10px;padding:4px 8px}
.mm{font-weight:600}
.why{margin-top:6px;font-size:16.5px;color:#333}
.why span{font-weight:700;color:#6f4cff}
.sol{margin-top:14px;border:3px solid var(--line);border-radius:18px;padding:12px 14px 14px;background:#fffdf6}
.solh{font-weight:700;font-size:19px}
.trap{margin-top:12px;padding:10px 12px;border-radius:14px;background:#ffe9d6;border:2px dashed #ff8a3d}
.vwrap{margin-top:16px;border-top:2px dashed #0002;padding-top:12px}
.vlab{font-weight:700;color:#6f4cff}
.vis{margin:8px 0 0;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px}
.vis svg{width:100%;height:auto;display:block}
.vis figcaption{font-size:15.5px;color:#444;margin-top:6px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.modes button{border:3px solid var(--line);border-radius:16px;background:#fff;padding:8px 10px;text-align:left;display:flex;flex-direction:column;box-shadow:3px 3px 0 var(--line)}
.modes button span{font-size:13px;color:#555}
.modes button.on{background:var(--yellow)}
.tests{display:grid;gap:8px;margin-top:10px}
.test{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:#fffdf6}
.test a{color:#6f4cff;font-weight:600}
.test .score{margin-left:auto;display:flex;gap:6px;align-items:center}
.test input{width:74px;font:inherit;border:2px solid var(--line);border-radius:10px;padding:3px 8px}
.btn.sm{padding:4px 12px;font-size:15px;box-shadow:2px 2px 0 var(--line)}
.rules{margin:0 0 6px 0;padding-left:22px;font-size:17px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 18px}
.srow,.grow{display:flex;gap:6px;align-items:center}
.srow .qn,.grow .qn{width:28px;font-weight:700;text-align:right}
.srow button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700}
.srow button.on{background:var(--ink);color:var(--yellow)}
.timer.warn{background:#ffb3b3}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:14px}
.grow{border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff}
.grow.ok{background:#d6f7e4}.grow.no{background:#ffe0e0}
.grow .mine{font-weight:700;width:24px;text-align:center}
.grow button{border:2px solid var(--line);border-radius:10px;background:#fff;width:40px;height:32px;font-weight:700}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.trow .tn{min-width:220px;font-weight:600}
.tbar{width:120px;height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.tbar i{display:block;height:100%;background:var(--lime)}
.misses{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.misses a{border:2px solid var(--line);border-radius:12px;padding:5px 10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600}
.misses a:hover{background:var(--yellow)}
.band{margin-top:12px}.bh{font-weight:700}
.focus{margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modes{grid-template-columns:repeat(4,1fr) !important}
.exams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.exam{border:3px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;background:#ece6ff;box-shadow:4px 4px 0 var(--line)}
.exam .et{font-size:20px;font-weight:700}
.exam span{font-size:14px;color:#444}
.exam b{margin-top:4px}
.exam.done{background:#d6f7e4}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dots button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.dots button.ans{background:var(--lime)}
.dots button.cur{outline:3px solid var(--pink);outline-offset:1px}
.ch button.pick{background:#fff1a8;border-color:var(--ink)}
.ch button.pick .L{background:var(--purple)}
.rev{border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:8px;background:#fff}
.rev.ok{border-left:8px solid var(--good)}.rev.no{border-left:8px solid var(--bad)}
.rev summary{cursor:pointer}
.card.parent{background:#f3f0ff}
.fb.ok{background:#d6f7e4}.fb.no{background:#fff1c9}.fb.hint{background:#ece6ff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.spacer{flex:1}
.prog{height:14px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--lime)}
.done{text-align:center}
.done .big{font-size:80px}
.stars{font-size:40px;letter-spacing:6px}
.hist{font-size:15px;color:#444;margin-top:8px}
.conf{position:fixed;top:-20px;font-size:26px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.zh{font-size:15px;opacity:.7}
.timer{font-variant-numeric:tabular-nums}
@media (max-width:520px){.exams{grid-template-columns:1fr}.modes{grid-template-columns:1fr 1fr !important}.trow .tn{min-width:0;width:100%}.test .score{margin-left:0}.step{flex-direction:column;gap:2px}.word .wt{font-size:18px}body{font-size:17px}.top h1{font-size:20px !important}.six p{font-size:19px}.q{font-size:19px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="lessons.js?v=20261119o"></script>
<script src="gym.js?v=20261119o"></script>
<script src="visuals.js?v=20261119o"></script>
<script src="realtests.js?v=20261119o"></script>
<script>
(() => {
const LS = "eric_amc_progress";
const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
let P = load(); P.lessons = P.lessons || {}; P.mixed = P.mixed || []; P.tests = P.tests || {}; P.exams = P.exams || { daily: {}, weekly: {}, log: [] };
const VIS = window.AMC_VIS || { main: {}, moves: {} }, GYM = window.AMC_GYM, REAL = window.AMC_REAL || {};
const PARENT = new URLSearchParams(location.search).get("p") === "1";
const probURL = (y, n) => `https://artofproblemsolving.com/wiki/index.php/${y}_AMC_8_Problems/Problem_${n}`;
const lessonOf = topic => LES.findIndex(l => l.id === topic);
const topicName = t => { const l = LES[lessonOf(t)]; return l ? `${l.emoji} ${l.title}` : "🧩 Logic & puzzles"; };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} };
const LES = window.AMC_LESSONS || [];
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const TESTS = [2026, 2025, 2024, 2023, 2022, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013];
const LET = "ABCDE", LABELS = ["👀 Look", "🧠 Plan", "⚔️ Solve", "✅ Check"], COLORS = ["c1", "c2", "c3", "c4", "c5", "c6"];
// week plan from "My AMC 8 plan" (Mondays)
const WEEKS = [["2026-11-23", [1]], ["2026-11-30", [2, 3]], ["2026-12-07", [3, 4]], ["2026-12-14", [5]], ["2026-12-21", [6, 7, 8]], ["2026-12-28", [9, 10, 11]], ["2027-01-04", [12, 13]], ["2027-01-11", [14]]];
const today = new Date().toLocaleDateString("en-CA");
const thisWeek = (WEEKS.filter(w => w[0] <= today).pop() || WEEKS[0])[1];
const starsOf = id => (P.lessons[id] || {}).best || 0;
const starStr = (n, of = 5) => "★".repeat(n) + "☆".repeat(of - n);
const total = () => LES.reduce((a, l) => a + starsOf(l.id), 0);
const confetti = () => { for (let i = 0; i < 26; i++) { const d = document.createElement("div"); d.className = "conf"; d.textContent = ["⭐", "🎉", "✨", "🏆", "💫"][i % 5]; d.style.left = Math.random() * 100 + "vw"; d.style.animationDelay = Math.random() * .5 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); } };

function home() {
  window.scrollTo(0, 0);
  const lastMix = P.mixed[P.mixed.length - 1];
  app.innerHTML = `<div class="top"><h1>🏆 AMC 8 Lessons</h1><span class="pill">⭐ ${total()} / ${LES.length * 5}</span></div>
    <p class="sub">Every chapter of your book, explained super simply. Each lesson: a simple story → power moves → watch me solve → your turn. Get it right on the first try to earn a star.</p>
    ${examsHtml()}
    <div class="row"><button class="btn pink" id="mixBtn">🔀 Mixed review (10 problems)</button>${lastMix ? `<span class="sub">Last mixed review: ${lastMix.score}/${lastMix.of} on ${lastMix.date}</span>` : `<span class="sub">Mixing chapters is how the real test feels.</span>`}</div>
    <div class="grid">${LES.map((l, i) => `<button class="tile ${COLORS[i % 6]}" data-l="${i}">${thisWeek.includes(l.n) ? `<span class="wk">This week</span>` : ""}<div class="em">${l.emoji}</div><div class="n">Lesson ${l.n}</div><div class="t">${esc(l.title)}</div><div class="z">${esc(l.zh)}</div><div class="st">${starStr(starsOf(l.id))}</div><div class="pg">${(P.lessons[l.id] || {}).chBest != null ? `⬆️ ${(P.lessons[l.id]).chBest}/3 · ` : ""}${((P.lessons[l.id] || {}).gym || {}).done ? `♾️ ${(P.lessons[l.id]).gym.done} · ` : ""}Book p. ${esc(l.pages)}</div></button>`).join("")}</div>
    ${PARENT ? `<div class="card parent"><div class="q">👨‍👩‍👦 Parent corner <span class="sub">(Eric doesn't see this section)</span></div>${parentHistory()}</div>` : ""}
    ${!PARENT ? "" : `<div class="card parent"><div class="q">📝 Real AMC 8 tests (parents)</div><p class="sub">The truest practice: a real past test, timed at exactly 40 minutes, no calculator. Do it on AoPS (or print it), check the answer key, read the step-by-step solutions on Random Math for anything you missed, and type in your score. Start with the newer years; do one every week or two from mid-December. More years: <a href="https://www.randommath.com/past-contests/amc-8-tests-and-solutions" target="_blank" rel="noopener">Random Math archive ↗</a></p>
      ${focusHtml()}
      <div class="tests">${TESTS.map(y => { const t = P.tests[y]; return `<div class="test"><b>${y} AMC 8</b>${REAL[y] ? `<button class="btn sm go" data-take="${y}">▶ Take it here</button>` : ""}<a href="https://artofproblemsolving.com/wiki/index.php/${y}_AMC_8_Problems" target="_blank" rel="noopener">Problems ↗</a><a href="https://artofproblemsolving.com/wiki/index.php/${y}_AMC_8_Answer_Key" target="_blank" rel="noopener">Answer key ↗</a>${y <= 2024 ? `<a href="https://wiki.randommath.com/amc8/${y}" target="_blank" rel="noopener">Step-by-step solutions (Random Math) ↗</a>` : ""}
        <span class="score">${t ? `<b>${t.score}/25</b> <span class="sub">${t.date}</span>${t.marks ? ` <button class="btn sm" data-review="${y}">Review</button>` : ""}` : ""}</span></div>`; }).join("")}</div>
      <p class="sub" style="margin-top:8px">Score guide: 15+ = Achievement Roll (for 6th grade and below). Honor Roll (top 5%) has needed about 18–21. Keep the answer keys away from Eric until he's done. ▶ Take it here gives him a timed bubble sheet; you grade it with the key.</p></div>`}`;
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => lesson(+b.dataset.l, 0));
  app.querySelectorAll("[data-take]").forEach(b => b.onclick = () => realTest(+b.dataset.take));
  app.querySelectorAll("[data-review]").forEach(b => b.onclick = () => realResults(+b.dataset.review));
  app.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => lesson(+b.dataset.focus, 0));
  $("#mixBtn").onclick = mixed;
  app.querySelectorAll("[data-exam]").forEach(b => b.onclick = () => exam(b.dataset.exam));
  app.querySelectorAll("[data-erev]").forEach(b => b.onclick = () => { const e = P.exams.log[+b.dataset.erev]; if (e && e.items) examResults(e); });
}

function lesson(i, step, mode) {
  window.scrollTo(0, 0);
  const l = LES[i], names = ["1 · Like I'm 6", "2 · Key words", "3 · Power moves", "4 · Watch me solve", "5 · Your turn"];
  const head = `<div class="top"><button class="btn" id="back">← Lessons</button><h1 style="font-size:24px">${l.emoji} ${esc(l.title)} <span class="zh">${esc(l.zh)}</span></h1></div>
    <div class="steps">${names.map((n, k) => `<button class="${k === step ? "on" : k < step ? "done" : ""}" data-s="${k}">${n}</button>`).join("")}</div>`;
  const nav = (next, label) => `<div class="row"><span class="spacer"></span><button class="btn go" id="next">${label || "Next →"}</button></div>`;
  let body = "";
  if (step === 0) body = `<div class="card six"><div class="big" style="font-size:48px">${l.emoji}</div>${l.six.map(p => `<p>${esc(p)}</p>`).join("")}${VIS.main[l.id] ? `<div class="vwrap"><div class="vlab">👀 See it</div>${VIS.main[l.id]()}</div>` : ""}</div>${nav(1, "Got it! →")}`;
  if (step === 1) body = `<div class="card"><div class="q">📘 Key words: know these first</div><p class="sub">AMC problems use these words. If one is fuzzy, the whole problem gets fuzzy.</p>
      <div class="words">${l.words.map(w => `<div class="word"><div class="wt">${esc(w[0])} <span class="zh">${esc(w[1])}</span></div><div>${esc(w[2])}</div><div class="eg">e.g. ${esc(w[3])}</div></div>`).join("")}</div></div>${nav(2, "I know these words →")}`;
  if (step === 2) body = `<div class="card"><div class="q">⚡ Power moves</div><p class="sub">Each move comes with WHY it works. If you know why, you'll remember it on test day.</p>${l.moves.map((m, k) => `<div class="move"><b>${k + 1}</b><div style="flex:1;min-width:0"><div class="mm">${esc(m.m)}</div><div class="why"><span>🤔 Why it works:</span> ${esc(m.why)}</div>${(VIS.moves[l.id] || {})[k] ? VIS.moves[l.id][k]() : ""}</div></div>`).join("")}<p class="sub" style="margin-top:12px">📖 More in your book, pages ${esc(l.pages)}.</p></div>${nav(3)}`;
  if (step === 3) body = `<div id="exs"></div>`;
  if (step === 4) { mode = mode || "basic"; const rec = P.lessons[l.id] || {};
    body = `<div class="modes">${[["basic", `⭐ Starter (5)`, starStr(starsOf(l.id))], ["challenge", "⬆️ Challenge (3)", rec.chBest != null ? `best ${rec.chBest}/3` : "harder, multi-step"], ["gym", "♾️ Practice gym", (rec.gym || {}).done ? `${rec.gym.done} done` : "endless, new numbers"], ...(PARENT ? [["real", "🏆 Real AMC", "past test problems"]] : [])].map(([m, t, sub]) => `<button class="${m === mode ? "on" : ""}" data-mode="${m}"><b>${t}</b><span>${sub}</span></button>`).join("")}</div><div id="pr"></div>`; }
  app.innerHTML = head + body;
  $("#back").onclick = home;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => lesson(i, +b.dataset.s));
  if ($("#next")) $("#next").onclick = () => lesson(i, step + 1);
  if (step === 3) examples(l, i);
  if (step === 4) {
    app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => lesson(i, 4, b.dataset.mode));
    if (mode === "real") { realList(l); return; }
    if (mode === "gym") practice([GYM.make(l.id)].map(p => ({ ...p, from: l })), i, "gym");
    else practice((mode === "challenge" ? l.ch : l.pr).map(p => ({ ...p, from: l })), i, mode);
  }
}

function examples(l, i) {
  let e = 0, shown = 1;
  const draw = () => {
    const x = l.ex[e];
    $("#exs").innerHTML = `<div class="card"><div class="sub">Example ${e + 1} of ${l.ex.length}</div><div class="q">${esc(x.q)}</div>

// ---------- daily & weekly exams: randomized, weighted like the real AMC 8, auto-graded ----------
const WEIGHT = (() => { const w = {}; Object.values(REAL).forEach(t => t.forEach(tp => { if (tp !== "logic") w[tp] = (w[tp] || 0) + 1; })); LES.forEach(l => { w[l.id] = Math.max(w[l.id] || 0, 3); }); return w; })();
const mondayOf = d => { const x = new Date(d + "T12:00:00"); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x.toLocaleDateString("en-CA"); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickTopic(pool) { const tot = pool.reduce((s, id) => s + WEIGHT[id], 0); let r = Math.random() * tot; for (const id of pool) { r -= WEIGHT[id]; if (r <= 0) return id; } return pool[pool.length - 1]; }
function examItem(id, level, used) {
  const l = LES[lessonOf(id)];
  const fresh = arr => shuffle(arr.filter(p => !used.has(p.q)));
  let p = null;
  if (level === "hard") p = fresh(l.ch)[0];
  if (!p && level === "easy" && Math.random() < 0.5) p = fresh(l.pr)[0];
  if (!p) { for (let t = 0; t < 8 && (!p || used.has(p.q)); t++) p = GYM.make(id); }
  used.add(p.q);
  return { ...p, from: l, topic: id, level };
}
function buildExam(kind) {
  const used = new Set();
  if (kind === "daily") {
    const upTo = Math.max(...thisWeek);
    let pool = LES.filter(l => P.lessons[l.id] || l.n <= upTo).map(l => l.id);
    for (const l of LES) { if (pool.length >= 3) break; if (!pool.includes(l.id)) pool.push(l.id); }
    return ["easy", "easy", "medium", "medium", "hard"].map(lv => examItem(pickTopic(pool), lv, used));
  }
  const all = LES.map(l => l.id), levels = [...Array(10).fill("easy"), ...Array(8).fill("medium"), ...Array(7).fill("hard")];
  // spread topics: no topic more than 3 times
  const count = {};
  return levels.map(lv => { let id; do { id = pickTopic(all); } while ((count[id] || 0) >= 3); count[id] = (count[id] || 0) + 1; return examItem(id, lv, used); });
}
function examsHtml() {
  const d = P.exams.daily[today], w = P.exams.weekly[mondayOf(today)];
  return `<div class="exams"><button class="exam ${d ? "done" : ""}" data-exam="daily"><span class="et">📅 Daily exam</span><span>5 problems · 10 min</span><b>${d ? `Today: ${d.score}/${d.of} ✅` : "Not done yet today"}</b></button>
    <button class="exam ${w ? "done" : ""}" data-exam="weekly"><span class="et">🏁 Weekly exam</span><span>25 problems · 40 min · like the real AMC 8</span><b>${w ? `This week: ${w.score}/25 ✅` : "Not done yet this week"}</b></button></div>`;
}

      <div class="dots">${items.map((_, j) => `<button class="${j === k ? "cur" : ""} ${ans[j] >= 0 ? "ans" : ""}" data-jump="${j}">${j + 1}</button>`).join("")}</div>

        <div class="ch">${p.c.map((c, j) => `<button class="${ans[k] === j ? "pick" : ""}" data-j="${j}"><span class="L">${LET[j]}</span><span>${esc(c)}</span></button>`).join("")}</div>
        <div class="row"><button class="btn" id="prev" ${k === 0 ? "disabled" : ""}>◀ Back</button><span class="spacer"></span>${k < items.length - 1 ? `<button class="btn alt" id="nxt">Next ▶</button>` : ""}<button class="btn go" id="sub">Hand it in ✅</button></div></div>`;

      score: items.reduce((s, p, j) => s + (ans[j] === p.a ? 1 : 0), 0),

    res.topics = {}; res.items.forEach(it => { const t = res.topics[it.topic] = res.topics[it.topic] || [0, 0]; t[1]++; if (it.you === it.a) t[0]++; });
    if (official) { if (kind === "daily") P.exams.daily[today] = { score: res.score, of: res.of }; else P.exams.weekly[res.week] = { score: res.score, of: res.of }; }
    P.exams.log.push(res); P.exams.log = P.exams.log.slice(-40); save();
    if (res.score >= Math.ceil(res.of * 0.8)) confetti();
    examResults(res);
  };
  exTimer = setInterval(() => { left--; const el = $("#clock"); if (el) { el.textContent = clock(); el.classList.toggle("warn", left <= 120); } if (left <= 0) finish(); }, 1000);
  draw();
}
function examResults(r) {
  window.scrollTo(0, 0);
  const rows = Object.entries(r.topics).sort((a, b) => (a[1][0] / a[1][1]) - (b[1][0] / b[1][1]));
  const weak = rows.filter(([, v]) => v[0] < v[1]).slice(0, 3);
  app.innerHTML = `<div class="top"><button class="btn" id="back">← Lessons</button><h1 style="font-size:22px">${r.kind === "daily" ? "📅 Daily exam" : "🏁 Weekly exam"} results</h1></div>
    <div class="card done"><div class="big">${r.score === r.of ? "🏆" : r.score >= r.of * 0.6 ? "🎉" : "💪"}</div><p class="q">${r.score} / ${r.of}</p>
      <p class="sub">${r.date} · ${Math.floor(r.secs / 60)} min ${r.secs % 60} s${r.official ? "" : " · practice retake"}</p>
      ${r.kind === "weekly" ? `<p>${r.score >= 21 ? "Honor Roll level!" : r.score >= 15 ? "Achievement Roll level (15+)!" : `Problems 1–10: ${r.items.slice(0, 10).filter(i => i.you === i.a).length}/10. Make those rock-solid first.`}</p>` : ""}
      ${weak.length ? `<p>🎯 Work on: ${weak.map(([tp]) => `<button class="btn sm" data-go="${lessonOf(tp)}">${topicName(tp)}</button>`).join(" ")}</p>` : `<p>Every topic perfect. 🔥</p>`}</div>
    <div class="card"><div class="q">By topic</div>${rows.map(([tp, v]) => `<div class="trow"><span class="tn">${topicName(tp)}</span><span class="tbar"><i style="width:${v[0] / v[1] * 100}%"></i></span><b>${v[0]}/${v[1]}</b></div>`).join("")}</div>
    <div class="card"><div class="q">Every problem, with the solution</div><p class="sub">Tap a problem to see how to solve it. Add your misses to the error log. 📒</p>
      ${r.items.map((it, j) => `<details class="rev ${it.you === it.a ? "ok" : "no"}"><summary><b>${j + 1}.</b> ${it.you === it.a ? "✅" : it.you < 0 ? "⬜" : "❌"} ${esc(it.q)} <span class="sub">${topicName(it.topic)}${it.level === "hard" ? " · ⬆️ hard" : ""}</span></summary>
        <p>Your answer: <b>${it.you >= 0 ? LET[it.you] + " (" + esc(it.c[it.you]) + ")" : "blank"}</b> · Correct: <b>${LET[it.a]} (${esc(it.c[it.a])})</b></p>
        <div class="sol">${it.steps.map((st, n) => `<div class="step s${n}"><span class="lb">${LABELS[n]}</span><div>${esc(st)}</div></div>`).join("")}<div class="trap">⚠️ <b>Trap:</b> ${esc(it.trap)}</div></div></details>`).join("")}</div>`;
  $("#back").onclick = home;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => lesson(+b.dataset.go, 0));
}
function parentHistory() {
  const log = P.exams.log.filter(e => e.official).slice(-12).reverse();
  const miss = {}; P.exams.log.slice(-15).forEach(e => Object.entries(e.topics || {}).forEach(([tp, v]) => { miss[tp] = miss[tp] || [0, 0]; miss[tp][0] += v[0]; miss[tp][1] += v[1]; }));
  const weak = Object.entries(miss).filter(([, v]) => v[1] >= 2).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).slice(0, 4);
  return `<div class="sub">Exam history (official attempts):</div>
    ${log.length ? `<div class="misses">${log.map(e => `<button class="btn sm" data-erev="${P.exams.log.indexOf(e)}">${e.kind === "daily" ? "📅" : "🏁"} ${e.date}: ${e.score}/${e.of}</button>`).join("")}</div>` : `<p class="sub">No exams yet.</p>`}
    ${weak.length ? `<p style="margin-top:10px"><b>Weakest topics lately:</b> ${weak.map(([tp, v]) => `${topicName(tp)} ${Math.round(v[0] / v[1] * 100)}%`).join(" · ")}</p>` : ""}
    ${focusHtml()}`;
}

function mixed() {
  window.scrollTo(0, 0);
  // interleaved: prefer lessons he's started; otherwise draw from this week's and earlier chapters
  const upTo = Math.max(...thisWeek);
  let chosen = LES.filter(l => P.lessons[l.id] || l.n <= upTo);
  for (const l of LES) { if (chosen.length >= 3) break; if (!chosen.includes(l)) chosen.push(l); }
  const pool = chosen.flatMap(l => [...l.pr, ...l.ch.slice(0, 1), GYM.make(l.id), GYM.make(l.id)].map(p => ({ ...p, from: l })));
  for (let a = pool.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [pool[a], pool[b]] = [pool[b], pool[a]]; }
  const pick = []; const used = new Set();
  pool.forEach(p => { if (pick.length < 10 && (!used.has(p.from.id) || pool.length < 20 || pick.length >= new Set(pool.map(x => x.from.id)).size)) { pick.push(p); used.add(p.from.id); } });
  pool.forEach(p => { if (pick.length < 10 && !pick.includes(p)) pick.push(p); });
  app.innerHTML = `<div class="top"><button class="btn" id="back">← Lessons</button><h1 style="font-size:24px">🔀 Mixed review</h1></div><p class="sub">Problems from different chapters, all mixed up, just like the real test. Figure out WHICH power move each one needs.</p><div id="pr"></div>`;
  $("#back").onclick = home;
  practice(pick.slice(0, 10), -1);
}

home();
})();
</script>

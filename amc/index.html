<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script>if (window.top === window) location.replace("../");</script>
<title>AMC 8 Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161d;--bg:#fff8ec;--card:#fff;--lime:#c4f53a;--pink:#ff5ccb;--orange:#ff8a3d;--blue:#5cc8ff;--yellow:#ffe066;--purple:#8a6bff;--good:#2fbf71;--bad:#ff5a5a;--line:#16161d}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45;background-image:radial-gradient(#00000012 1px,transparent 1px);background-size:18px 18px}
button{font:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:30px;font-weight:700;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--yellow);border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;box-shadow:3px 3px 0 var(--line)}
.btn{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 18px;font-weight:600;box-shadow:4px 4px 0 var(--line);transition:transform .1s}
.btn:hover{transform:translate(-1px,-1px)} .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.go{background:var(--lime)} .btn.alt{background:var(--blue)} .btn.pink{background:var(--pink);color:#fff}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.sub{color:#555;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:18px}
.tile{position:relative;text-align:left;border:3px solid var(--line);border-radius:22px;padding:14px 14px 12px;box-shadow:5px 5px 0 var(--line);background:#fff;transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile .em{font-size:38px;line-height:1}
.tile .n{font-size:13px;font-weight:600;opacity:.7;margin-top:6px}
.tile .t{font-size:19px;font-weight:700;line-height:1.2}
.tile .z{font-size:14px;opacity:.75}
.tile .st{margin-top:8px;font-size:18px;letter-spacing:2px}
.tile .wk{position:absolute;top:10px;right:10px;background:var(--pink);color:#fff;border:2px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px}
.tile .pg{font-size:12.5px;opacity:.65}
.c1{background:#e8ffd0}.c2{background:#ffe3f5}.c3{background:#dff3ff}.c4{background:#fff1c9}.c5{background:#ece6ff}.c6{background:#ffe6d6}
.card{background:#fff;border:3px solid var(--line);border-radius:24px;padding:20px;box-shadow:6px 6px 0 var(--line);margin-top:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.steps button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14.5px;font-weight:600}
.steps button.on{background:var(--ink);color:var(--yellow)}
.steps button.done{background:var(--lime)}
.big{font-size:64px;line-height:1;text-align:center}
.six p{font-size:21px;margin:14px 0}
.six p:first-of-type{margin-top:6px}
.move{display:flex;gap:12px;align-items:flex-start;border:2px dashed #0003;border-radius:16px;padding:12px 14px;margin-top:10px;background:#fffdf6}
.move b{background:var(--yellow);border:2px solid var(--line);border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center}
.q{font-size:21px;font-weight:600}
.step{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:16px;border:2px solid var(--line)}
.step.new{animation:pop .25s}
.ch button:disabled{color:var(--ink);cursor:default}
.step .lb{font-weight:700;white-space:nowrap}
.s0{background:#dff3ff}.s1{background:#ece6ff}.s2{background:#ffe3f5}.s3{background:#e8ffd0}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.ch{display:grid;gap:10px;margin-top:14px}
.ch button{text-align:left;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-size:19px;display:flex;gap:12px;align-items:center;box-shadow:3px 3px 0 var(--line)}
.ch button .L{background:var(--ink);color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-weight:700;flex:none}
.ch button.right{background:#d6f7e4;border-color:var(--good)} .ch button.right .L{background:var(--good)}
.ch button.wrong{background:#ffe0e0;border-color:var(--bad);animation:shake .3s} .ch button.wrong .L{background:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:14px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);font-size:18px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.word{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fffdf6}
.word .wt{font-weight:700;font-size:19px}
.word .eg{margin-top:6px;font-size:15.5px;color:#555;background:#f3efe4;border-radius:10px;padding:4px 8px}
.mm{font-weight:600}
.why{margin-top:6px;font-size:16.5px;color:#333}
.why span{font-weight:700;color:#6f4cff}
.sol{margin-top:14px;border:3px solid var(--line);border-radius:18px;padding:12px 14px 14px;background:#fffdf6}
.solh{font-weight:700;font-size:19px}
.trap{margin-top:12px;padding:10px 12px;border-radius:14px;background:#ffe9d6;border:2px dashed #ff8a3d}
.vwrap{margin-top:16px;border-top:2px dashed #0002;padding-top:12px}
.vlab{font-weight:700;color:#6f4cff}
.vis{margin:8px 0 0;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px}
.vis svg{width:100%;height:auto;display:block}
.vis figcaption{font-size:15.5px;color:#444;margin-top:6px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.modes button{border:3px solid var(--line);border-radius:16px;background:#fff;padding:8px 10px;text-align:left;display:flex;flex-direction:column;box-shadow:3px 3px 0 var(--line)}
.modes button span{font-size:13px;color:#555}
.modes button.on{background:var(--yellow)}
.tests{display:grid;gap:8px;margin-top:10px}
.test{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:#fffdf6}
.test a{color:#6f4cff;font-weight:600}
.test .score{margin-left:auto;display:flex;gap:6px;align-items:center}
.test input{width:74px;font:inherit;border:2px solid var(--line);border-radius:10px;padding:3px 8px}
.btn.sm{padding:4px 12px;font-size:15px;box-shadow:2px 2px 0 var(--line)}
.fb.ok{background:#d6f7e4}.fb.no{background:#fff1c9}.fb.hint{background:#ece6ff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.spacer{flex:1}
.prog{height:14px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--lime)}
.done{text-align:center}
.done .big{font-size:80px}
.stars{font-size:40px;letter-spacing:6px}
.hist{font-size:15px;color:#444;margin-top:8px}
.conf{position:fixed;top:-20px;font-size:26px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.zh{font-size:15px;opacity:.7}
.timer{font-variant-numeric:tabular-nums}
@media (max-width:520px){.modes{grid-template-columns:1fr}.test .score{margin-left:0}.step{flex-direction:column;gap:2px}.word .wt{font-size:18px}body{font-size:17px}.top h1{font-size:20px !important}.six p{font-size:19px}.q{font-size:19px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="lessons.js?v=20261119n"></script>
<script src="gym.js?v=20261119n"></script>
<script src="visuals.js?v=20261119n"></script>
<script>
(() => {
const LS = "eric_amc_progress";
const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
let P = load(); P.lessons = P.lessons || {}; P.mixed = P.mixed || []; P.tests = P.tests || {};
const VIS = window.AMC_VIS || { main: {}, moves: {} }, GYM = window.AMC_GYM;
const save = () => { try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} };
const LES = window.AMC_LESSONS || [];
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const TESTS = [2026, 2025, 2024, 2023, 2022, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013];
const LET = "ABCDE", LABELS = ["👀 Look", "🧠 Plan", "⚔️ Solve", "✅ Check"], COLORS = ["c1", "c2", "c3", "c4", "c5", "c6"];
// week plan from "My AMC 8 plan" (Mondays)
const WEEKS = [["2026-11-23", [1]], ["2026-11-30", [2, 3]], ["2026-12-07", [3, 4]], ["2026-12-14", [5]], ["2026-12-21", [6, 7, 8]], ["2026-12-28", [9, 10, 11]], ["2027-01-04", [12, 13]], ["2027-01-11", [14]]];
const today = new Date().toLocaleDateString("en-CA");
const thisWeek = (WEEKS.filter(w => w[0] <= today).pop() || WEEKS[0])[1];
const starsOf = id => (P.lessons[id] || {}).best || 0;
const starStr = (n, of = 5) => "★".repeat(n) + "☆".repeat(of - n);
const total = () => LES.reduce((a, l) => a + starsOf(l.id), 0);
const confetti = () => { for (let i = 0; i < 26; i++) { const d = document.createElement("div"); d.className = "conf"; d.textContent = ["⭐", "🎉", "✨", "🏆", "💫"][i % 5]; d.style.left = Math.random() * 100 + "vw"; d.style.animationDelay = Math.random() * .5 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); } };

function home() {
  window.scrollTo(0, 0);
  const lastMix = P.mixed[P.mixed.length - 1];
  app.innerHTML = `<div class="top"><h1>🏆 AMC 8 Lessons</h1><span class="pill">⭐ ${total()} / ${LES.length * 5}</span></div>
    <p class="sub">Every chapter of your book, explained super simply. Each lesson: a simple story → power moves → watch me solve → your turn. Get it right on the first try to earn a star.</p>
    <div class="row"><button class="btn pink" id="mixBtn">🔀 Mixed review (10 problems)</button>${lastMix ? `<span class="sub">Last mixed review: ${lastMix.score}/${lastMix.of} on ${lastMix.date}</span>` : `<span class="sub">Mixing chapters is how the real test feels.</span>`}</div>
    <div class="grid">${LES.map((l, i) => `<button class="tile ${COLORS[i % 6]}" data-l="${i}">${thisWeek.includes(l.n) ? `<span class="wk">This week</span>` : ""}<div class="em">${l.emoji}</div><div class="n">Lesson ${l.n}</div><div class="t">${esc(l.title)}</div><div class="z">${esc(l.zh)}</div><div class="st">${starStr(starsOf(l.id))}</div><div class="pg">${(P.lessons[l.id] || {}).chBest != null ? `⬆️ ${(P.lessons[l.id]).chBest}/3 · ` : ""}${((P.lessons[l.id] || {}).gym || {}).done ? `♾️ ${(P.lessons[l.id]).gym.done} · ` : ""}Book p. ${esc(l.pages)}</div></button>`).join("")}</div>
    <div class="card"><div class="q">📝 Real AMC 8 tests</div><p class="sub">The truest practice: a real past test, timed at exactly 40 minutes, no calculator. Do it on AoPS (or print it), check the answer key, read the step-by-step solutions on Random Math for anything you missed, and type in your score. Start with the newer years; do one every week or two from mid-December. More years: <a href="https://www.randommath.com/past-contests/amc-8-tests-and-solutions" target="_blank" rel="noopener">Random Math archive ↗</a></p>
      <div class="tests">${TESTS.map(y => { const t = P.tests[y]; return `<div class="test"><b>${y} AMC 8</b><a href="https://artofproblemsolving.com/wiki/index.php/${y}_AMC_8_Problems" target="_blank" rel="noopener">Problems ↗</a><a href="https://artofproblemsolving.com/wiki/index.php/${y}_AMC_8_Answer_Key" target="_blank" rel="noopener">Answer key ↗</a>${y <= 2024 ? `<a href="https://wiki.randommath.com/amc8/${y}" target="_blank" rel="noopener">Step-by-step solutions (Random Math) ↗</a>` : ""}
        <span class="score">${t ? `<b>${t.score}/25</b> <span class="sub">${t.date}</span>` : ""}<input type="number" min="0" max="25" placeholder="score" data-ty="${y}"><button class="btn sm" data-ts="${y}">Save</button></span></div>`; }).join("")}</div>
      <p class="sub" style="margin-top:8px">Score guide: 15+ = Achievement Roll (for 6th grade and below). Honor Roll (top 5%) has needed about 18–21.</p></div>`;
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => lesson(+b.dataset.l, 0));
  app.querySelectorAll("[data-ts]").forEach(b => b.onclick = () => { const y = b.dataset.ts, v = +app.querySelector(`[data-ty="${y}"]`).value; if (!(v >= 0 && v <= 25) || app.querySelector(`[data-ty="${y}"]`).value === "") return; P.tests[y] = { score: v, date: today }; save(); if (v >= 15) confetti(); home(); });
  $("#mixBtn").onclick = mixed;
}

function lesson(i, step, mode) {
  window.scrollTo(0, 0);
  const l = LES[i], names = ["1 · Like I'm 6", "2 · Key words", "3 · Power moves", "4 · Watch me solve", "5 · Your turn"];
  const head = `<div class="top"><button class="btn" id="back">← Lessons</button><h1 style="font-size:24px">${l.emoji} ${esc(l.title)} <span class="zh">${esc(l.zh)}</span></h1></div>
    <div class="steps">${names.map((n, k) => `<button class="${k === step ? "on" : k < step ? "done" : ""}" data-s="${k}">${n}</button>`).join("")}</div>`;
  const nav = (next, label) => `<div class="row"><span class="spacer"></span><button class="btn go" id="next">${label || "Next →"}</button></div>`;
  let body = "";
  if (step === 0) body = `<div class="card six"><div class="big" style="font-size:48px">${l.emoji}</div>${l.six.map(p => `<p>${esc(p)}</p>`).join("")}${VIS.main[l.id] ? `<div class="vwrap"><div class="vlab">👀 See it</div>${VIS.main[l.id]()}</div>` : ""}</div>${nav(1, "Got it! →")}`;
  if (step === 1) body = `<div class="card"><div class="q">📘 Key words: know these first</div><p class="sub">AMC problems use these words. If one is fuzzy, the whole problem gets fuzzy.</p>
      <div class="words">${l.words.map(w => `<div class="word"><div class="wt">${esc(w[0])} <span class="zh">${esc(w[1])}</span></div><div>${esc(w[2])}</div><div class="eg">e.g. ${esc(w[3])}</div></div>`).join("")}</div></div>${nav(2, "I know these words →")}`;
  if (step === 2) body = `<div class="card"><div class="q">⚡ Power moves</div><p class="sub">Each move comes with WHY it works. If you know why, you'll remember it on test day.</p>${l.moves.map((m, k) => `<div class="move"><b>${k + 1}</b><div style="flex:1;min-width:0"><div class="mm">${esc(m.m)}</div><div class="why"><span>🤔 Why it works:</span> ${esc(m.why)}</div>${(VIS.moves[l.id] || {})[k] ? VIS.moves[l.id][k]() : ""}</div></div>`).join("")}<p class="sub" style="margin-top:12px">📖 More in your book, pages ${esc(l.pages)}.</p></div>${nav(3)}`;
  if (step === 3) body = `<div id="exs"></div>`;
  if (step === 4) { mode = mode || "basic"; const rec = P.lessons[l.id] || {};
    body = `<div class="modes">${[["basic", `⭐ Starter (5)`, starStr(starsOf(l.id))], ["challenge", "⬆️ Challenge (3)", rec.chBest != null ? `best ${rec.chBest}/3` : "harder, multi-step"], ["gym", "♾️ Practice gym", (rec.gym || {}).done ? `${rec.gym.done} done` : "endless, new numbers"]].map(([m, t, sub]) => `<button class="${m === mode ? "on" : ""}" data-mode="${m}"><b>${t}</b><span>${sub}</span></button>`).join("")}</div><div id="pr"></div>`; }
  app.innerHTML = head + body;
  $("#back").onclick = home;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => lesson(i, +b.dataset.s));
  if ($("#next")) $("#next").onclick = () => lesson(i, step + 1);
  if (step === 3) examples(l, i);
  if (step === 4) {
    app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => lesson(i, 4, b.dataset.mode));
    if (mode === "gym") practice([GYM.make(l.id)].map(p => ({ ...p, from: l })), i, "gym");
    else practice((mode === "challenge" ? l.ch : l.pr).map(p => ({ ...p, from: l })), i, mode);
  }
}

function examples(l, i) {
  let e = 0, shown = 1;
  const draw = () => {
    const x = l.ex[e];
    $("#exs").innerHTML = `<div class="card"><div class="sub">Example ${e + 1} of ${l.ex.length}</div><div class="q">${esc(x.q)}</div>
      ${x.steps.slice(0, shown).map((s, k) => `<div class="step s${k}${k === shown - 1 && shown > 1 ? " new" : ""}"><span class="lb">${LABELS[k]}</span><div>${esc(s)}</div></div>`).join("")}</div>
      <div class="row"><span class="sub">Try it yourself first, then tap to see the next step.</span><span class="spacer"></span>
      ${shown < 4 ? `<button class="btn alt" id="more">Show next step (${shown}/4)</button>` : e < l.ex.length - 1 ? `<button class="btn go" id="nx">Next example →</button>` : `<button class="btn go" id="nx">My turn! →</button>`}</div>`;
    if ($("#more")) $("#more").onclick = () => { shown++; draw(); };
    if ($("#nx")) $("#nx").onclick = () => { if (e < l.ex.length - 1) { e++; shown = 1; draw(); window.scrollTo(0, 0); } else lesson(i, 4); };
  };
  draw();
}

// shared practice runner: lesson practice (i >= 0) or mixed review (i = -1)
function practice(list, i, mode) {
  mode = mode || (i < 0 ? "mixed" : "basic");
  let k = 0, right = 0, tries = 0, hinted = false; const t0 = Date.now(); let timerI = null;
  const box = $("#pr") || app;
  const draw = () => {
    const p = list[k]; tries = 0; hinted = false; let hints = 0;
    const solution = () => `<div class="sol"><div class="solh">📝 How to solve it</div>${p.steps.map((st, n) => `<div class="step s${n}"><span class="lb">${LABELS[n]}</span><div>${esc(st)}</div></div>`).join("")}<div class="trap">⚠️ <b>Trap:</b> ${esc(p.trap)}</div></div>`;
    box.innerHTML = `<div class="card"><div class="row" style="margin-top:0"><span class="sub">${mode === "gym" ? `♾️ Gym problem ${k + 1}` : `Problem ${k + 1} of ${list.length}`}${p.lvl === "challenge" ? ` · <b style="color:#ff5a5a">⬆️ challenge</b>` : ""}${i < 0 ? ` · from <b>${esc(p.from.emoji + " " + p.from.title)}</b>` : ""}</span><span class="spacer"></span><span class="pill">⭐ ${right}</span>${i < 0 ? `<span class="pill timer" id="tm">0:00</span>` : ""}</div>
      ${mode === "gym" ? "" : `<div class="prog"><i style="width:${k / list.length * 100}%"></i></div>`}
      <p class="q" style="margin-top:14px">${esc(p.q)}</p>
      <div class="ch">${p.c.map((c, j) => `<button data-j="${j}"><span class="L">${LET[j]}</span><span>${esc(c)}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <div class="row"><button class="btn" id="hint">💡 Hint</button><span class="spacer"></span>${mode === "gym" ? `<button class="btn" id="stop">🏁 Stop</button>` : ""}<button class="btn go" id="nx" style="display:none">${mode === "gym" ? "Next problem →" : k < list.length - 1 ? "Next →" : "Finish 🎉"}</button></div></div>`;
    if ($("#stop")) $("#stop").onclick = () => finish();
    $("#hint").onclick = () => { hinted = true; hints++;
      $("#fb").innerHTML = `<div class="fb hint"><div><b>👀 What to notice:</b> ${esc(p.steps[0])}</div>${hints > 1 ? `<div style="margin-top:6px"><b>🧠 The plan:</b> ${esc(p.steps[1])}</div>` : ""}</div>`;
      $("#hint").textContent = hints > 1 ? "💡 No more hints. You've got this!" : "💡 Another hint"; if (hints > 1) $("#hint").disabled = true; };
    box.querySelectorAll("[data-j]").forEach(b => b.onclick = () => {
      if (b.disabled) return; const j = +b.dataset.j; tries++;
      if (j === p.a) {
        b.classList.add("right"); box.querySelectorAll("[data-j]").forEach(x => x.disabled = true);
        const star = tries === 1; if (star) right++;
        $("#fb").innerHTML = `<div class="fb ok">${star ? "⭐ First try! " : "✅ Got it! "}${esc(p.why)}</div>${solution()}`;
        $("#nx").style.display = ""; $("#hint").style.display = "none";
      } else {
        b.classList.add("wrong"); b.disabled = true;
        if (tries >= 2) {
          box.querySelectorAll("[data-j]").forEach(x => x.disabled = true); box.querySelector(`[data-j="${p.a}"]`).classList.add("right");
          $("#fb").innerHTML = `<div class="fb no">The answer is <b>${LET[p.a]}</b>. Read the steps below, then write this one in your error log. 📒</div>${solution()}`;
          $("#nx").style.display = ""; $("#hint").style.display = "none";
        } else $("#fb").innerHTML = `<div class="fb no">Not quite. Try again! ${hints ? "" : "Tap 💡 for a hint."}</div>${hints ? `<div class="fb hint"><b>👀 What to notice:</b> ${esc(p.steps[0])}${hints > 1 ? `<div style="margin-top:6px"><b>🧠 The plan:</b> ${esc(p.steps[1])}</div>` : ""}</div>` : ""}`;
      }
    });
    $("#nx").onclick = () => { if (mode === "gym") { list.push({ ...GYM.make(LES[i].id), from: LES[i] }); } if (k < list.length - 1) { k++; draw(); window.scrollTo(0, 0); } else finish(); };
  };
  const finish = () => {
    clearInterval(timerI); const secs = Math.round((Date.now() - t0) / 1000);
    const answered = mode === "gym" ? (box.querySelector("#nx") && box.querySelector("#nx").style.display !== "none" ? k + 1 : k) : list.length;
    if (i >= 0) { const id = LES[i].id, rec = P.lessons[id] || { best: 0, tries: 0 }; rec.last = today;
      if (mode === "basic") { rec.tries++; rec.lastScore = right; rec.best = Math.max(rec.best, right); }
      if (mode === "challenge") rec.chBest = Math.max(rec.chBest || 0, right);
      if (mode === "gym") { rec.gym = rec.gym || { done: 0, right: 0 }; rec.gym.done += answered; rec.gym.right += right; }
      P.lessons[id] = rec; }
    else { P.mixed.push({ date: today, score: right, of: list.length, secs }); P.mixed = P.mixed.slice(-30); }
    const of = mode === "gym" ? Math.max(answered, 1) : list.length;
    save(); if (right >= Math.ceil(of * .8) && answered) confetti();
    const msg = mode === "gym" ? (answered ? `You did ${answered} gym problem${answered === 1 ? "" : "s"}. Every rep makes the move automatic! 💪` : "Come back any time for more reps.") : right === list.length ? "PERFECT! You're a problem-solving machine. 🤖" : right >= list.length * .6 ? "Great work! Redo your misses from the error log on Sunday." : "Every miss teaches you a trick. Look back at the power moves and try again!";
    box.innerHTML = `<div class="card done"><div class="big">${right === list.length ? "🏆" : right >= list.length * .6 ? "🎉" : "💪"}</div>
      ${mode === "gym" ? "" : `<div class="stars">${starStr(right, list.length)}</div>`}<p class="q">${right} / ${mode === "gym" ? answered : list.length} on the first try</p><p>${msg}</p>
      ${i < 0 ? `<p class="sub">Time: ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")} · Contest pace is about 2 minutes per problem.</p>` : `<p class="sub">Best on this lesson: ${starStr(starsOf(LES[i].id))} · 📖 Tell Mom or Dad when you finish this chapter in the book!</p>`}
      <div class="row" style="justify-content:center"><button class="btn" id="again">${i < 0 ? "🔀 Another mixed review" : mode === "gym" ? "♾️ More gym" : "🔁 Try again"}</button>${i >= 0 && mode === "basic" ? `<button class="btn pink" id="toCh">⬆️ Try the challenge</button>` : ""}${i >= 0 && mode === "challenge" ? `<button class="btn pink" id="toGym">♾️ Practice gym</button>` : ""}<button class="btn go" id="home">← All lessons</button></div></div>`;
    $("#again").onclick = () => i < 0 ? mixed() : lesson(i, 4, mode);
    if ($("#toCh")) $("#toCh").onclick = () => lesson(i, 4, "challenge");
    if ($("#toGym")) $("#toGym").onclick = () => lesson(i, 4, "gym");
    $("#home").onclick = home;
  };
  if (i < 0) timerI = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000), el = $("#tm"); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 1000);
  draw();
}

function mixed() {
  window.scrollTo(0, 0);
  // interleaved: prefer lessons he's started; otherwise draw from this week's and earlier chapters
  const upTo = Math.max(...thisWeek);
  let chosen = LES.filter(l => P.lessons[l.id] || l.n <= upTo);
  for (const l of LES) { if (chosen.length >= 3) break; if (!chosen.includes(l)) chosen.push(l); }
  const pool = chosen.flatMap(l => [...l.pr, ...l.ch.slice(0, 1), GYM.make(l.id), GYM.make(l.id)].map(p => ({ ...p, from: l })));
  for (let a = pool.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [pool[a], pool[b]] = [pool[b], pool[a]]; }
  const pick = []; const used = new Set();
  pool.forEach(p => { if (pick.length < 10 && (!used.has(p.from.id) || pool.length < 20 || pick.length >= new Set(pool.map(x => x.from.id)).size)) { pick.push(p); used.add(p.from.id); } });
  pool.forEach(p => { if (pick.length < 10 && !pick.includes(p)) pick.push(p); });
  app.innerHTML = `<div class="top"><button class="btn" id="back">← Lessons</button><h1 style="font-size:24px">🔀 Mixed review</h1></div><p class="sub">Problems from different chapters, all mixed up, just like the real test. Figure out WHICH power move each one needs.</p><div id="pr"></div>`;
  $("#back").onclick = home;
  practice(pick.slice(0, 10), -1);
}

home();
})();
</script>
